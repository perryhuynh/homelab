---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: unifi-network-mcp
spec:
  description: Only the agentgateway mcp proxy may reach unifi-network-mcp
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: unifi-network-mcp
  ingress:
    # Kubelet probes.
    - fromEntities:
        - host
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: networking
            gateway.networking.k8s.io/gateway-name: mcp
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    # Replies to this pod's own outbound connections. Cilium denies replies from
    # same-node peers under an ingress policy, so allow the ephemeral port range.
    # Peers still cannot open new connections to the listening ports.
    - fromEntities:
        - cluster
      toPorts:
        - ports:
            - port: "32768"
              endPort: 60999
              protocol: TCP
            - port: "32768"
              endPort: 60999
              protocol: UDP
