---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app unifi-network-mcp
spec:
  interval: 1h
  chart:
    kind: OCIRepository
    spec:
      interval: 15m
      ref:
        tag: 5.3.0
      url: oci://ghcr.io/bjw-s-labs/helm/app-template
      verify:
        provider: cosign
        matchOIDCIdentity:
          - issuer: "^https://token.actions.githubusercontent.com$"
            subject: "^https://github.com/bjw-s-labs/helm-charts.*$"
  values:
    controllers:
      unifi-network-mcp:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/sirkirby/unifi-network-mcp
              tag: 0.51.0@sha256:041ad1f19eba534efcba803d9e22846c64ffec611fb69f1a36726e7e5cc00143
            env:
              UNIFI_MCP_HOST: 0.0.0.0
              # bare host matches with or without a port; agentgateway v1.7 sends the
              # Service hostname without :3000
              UNIFI_MCP_ALLOWED_HOSTS: unifi-network-mcp.networking.svc.cluster.local
              UNIFI_MCP_HTTP_ENABLED: true
              UNIFI_MCP_HTTP_TRANSPORT: streamable-http
              UNIFI_NETWORK_HOST: unifi.internal
              UNIFI_NETWORK_VERIFY_SSL: false
              UNIFI_POLICY_NETWORK_CREATE: false
              UNIFI_POLICY_NETWORK_DELETE: false
              UNIFI_POLICY_NETWORK_UPDATE: false
            envFrom:
              - secretRef:
                  name: *app
            probes:
              liveness:
                enabled: true
                spec:
                  tcpSocket:
                    port: &port 3000
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                spec:
                  tcpSocket:
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                spec:
                  tcpSocket:
                    port: *port
                  failureThreshold: 30
                  periodSeconds: 10
            resources:
              limits:
                memory: 256Mi
              requests:
                cpu: 10m
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
    service:
      app:
        ports:
          http:
            port: *port
