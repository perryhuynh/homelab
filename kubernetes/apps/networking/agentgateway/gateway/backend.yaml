---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/agentgateway.dev/agentgatewaybackend_v1alpha1.json
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: mcp
spec:
  mcp:
    # Keep the shared MCP endpoint available when an upstream is unavailable.
    failureMode: FailOpen
    targets:
      - name: kguardian
        static:
          host: kguardian-llm-bridge.kguardian.svc.cluster.local
          port: 8080
          path: /mcp
          protocol: StreamableHTTP
          policies:
            auth:
              secretRef:
                name: kguardian-mcp-auth
      - name: kubernetes
        static:
          host: kubernetes-mcp-server.kube-system.svc.cluster.local
          port: 8080
          protocol: StreamableHTTP
      - name: unifi
        static:
          host: unifi-network-mcp.networking.svc.cluster.local
          port: 3000
          protocol: StreamableHTTP
      - name: flux
        static:
          host: flux-operator-mcp.flux-system.svc.cluster.local
          port: 9090
          protocol: StreamableHTTP
      - name: grafana
        static:
          host: grafana-mcp.observability.svc.cluster.local
          port: 8000
          protocol: StreamableHTTP
          policies:
            auth:
              secretRef:
                name: grafana-mcp-auth
      - name: victoria-logs
        static:
          host: victoria-logs-mcp.observability.svc.cluster.local
          port: 8080
          protocol: StreamableHTTP
      - name: victoria-metrics
        static:
          host: victoria-metrics-mcp.observability.svc.cluster.local
          port: 8080
          protocol: StreamableHTTP
      - name: konflate
        static:
          host: konflate.flux-system.svc.cluster.local
          port: 8080
          protocol: StreamableHTTP
      - name: home-assistant
        static:
          host: home-assistant-mcp.home.svc.cluster.local
          port: 8086
          # /readonly hides and blocks ha-mcp's write tools (ha_call_service,
          # ha_write_file, ...), which the gateway's write-name filter does not catch
          path: /mcp/readonly
          protocol: StreamableHTTP
