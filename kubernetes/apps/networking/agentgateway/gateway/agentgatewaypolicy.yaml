---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/agentgateway.dev/agentgatewaypolicy_v1alpha1.json
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: mcp-frontend
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: mcp
  frontend:
    tls:
      minProtocolVersion: "1.3"
      # the CRD's CEL rule requires handshakeTimeout whenever tls is set; 15s is the default
      handshakeTimeout: 15s
    accessLog:
      attributes:
        add:
          # src.addr is always the Tailscale app connector pod, so the client
          # user-agent is the only signal for telling MCP callers apart
          - name: http.user_agent
            expression: request.headers["user-agent"]
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/agentgateway.dev/agentgatewaypolicy_v1alpha1.json
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: mcp-backend
spec:
  targetRefs:
    - group: agentgateway.dev
      kind: AgentgatewayBackend
      name: mcp
  backend:
    mcp:
      authentication:
        # tokenless requests get a 401 pointing at the resource metadata, which is
        # what starts the OAuth flow in MCP clients
        mode: Strict
        issuer: https://auth.perryhuynh.com
        # Authelia only issues tokens for this audience to group:admins at login
        # (identity_providers.oidc.authorization_policies.mcp); admin membership is
        # re-checked on every call by the authorization rule below
        audiences:
          - &resource https://mcp.perryhuynh.com/mcp
        jwks:
          backendRef:
            group: agentgateway.dev
            kind: AgentgatewayBackend
            name: authelia-jwks
          jwksPath: jwks.json
        # served at /.well-known/oauth-protected-resource/mcp. authorization_servers
        # defaults to the issuer since no provider is set; clients fetch the
        # authorization server metadata from Authelia directly.
        resourceMetadata:
          resource: *resource
          scopesSupported: ["openid", "profile", "groups", "offline_access"]
          bearerMethodsSupported: ["header"]
      authorization:
        # Allow only admins, and never write-named tools (a backstop for the backends'
        # own read-only settings; denied tools are also filtered out of tools/list.
        # Dispatcher tools like unifi_execute and grafana_api_request are not covered
        # and still rely on backend permissions).
        # Authelia's authorization policy only runs at login, not on refresh; refreshed
        # access tokens re-read current groups, so checking jwt.groups here revokes a
        # removed admin within one access-token lifetime. Tokens without groups are denied.
        # mcp.tool is only set for tool operations, so prompts and resources stay visible.
        action: Allow
        policy:
          matchExpressions:
            - 'has(jwt.groups) && "admins" in jwt.groups && !(has(mcp.tool) && mcp.tool.name.matches("(^|_)(create|update|delete|remove|apply|patch|scale|restart|suspend|resume|reconcile|exec|install|uninstall)(_|$)"))'
