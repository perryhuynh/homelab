---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/agentgateway.dev/agentgatewaypolicy_v1alpha1.json
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: mcp-frontend
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: mcp
  frontend:
    tls:
      minProtocolVersion: "1.3"
      # the CRD's CEL rule requires handshakeTimeout whenever tls is set; 15s is the default
      handshakeTimeout: 15s
    accessLog:
      attributes:
        add:
          # src.addr is always the Tailscale app connector pod, so the client
          # user-agent is the only signal for telling MCP callers apart
          - name: http.user_agent
            expression: request.headers["user-agent"]
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/agentgateway.dev/agentgatewaypolicy_v1alpha1.json
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: mcp-backend
spec:
  targetRefs:
    - group: agentgateway.dev
      kind: AgentgatewayBackend
      name: mcp
  backend:
    mcp:
      # No authentication yet: /mcp stays unauthenticated until the Strict settings
      # from mcp-authtest are moved here. Only the tool-name backstop applies.
      authorization:
        # backstop for the backends' own read-only settings; denied tools are also
        # filtered out of tools/list. Dispatcher tools (unifi_execute,
        # grafana_api_request) are not covered and still rely on backend permissions.
        action: Deny
        policy:
          matchExpressions:
            - 'mcp.tool.name.matches("(^|_)(create|update|delete|remove|apply|patch|scale|restart|suspend|resume|reconcile|exec|install|uninstall)(_|$)")'
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/agentgateway.dev/agentgatewaypolicy_v1alpha1.json
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  # TEMPORARY: end-to-end test of Strict Authelia auth at /mcp/authtest without
  # touching /mcp. Retarget to AgentgatewayBackend/mcp once verified.
  name: mcp-authtest
spec:
  targetRefs:
    - group: agentgateway.dev
      kind: AgentgatewayBackend
      name: mcp-authtest
  backend:
    mcp:
      authentication:
        # tokenless requests get a 401 pointing at the resource metadata, which is
        # what starts the OAuth flow in MCP clients
        mode: Strict
        issuer: https://auth.perryhuynh.com
        # Authelia only issues tokens for this audience to group:admins
        # (identity_providers.oidc.authorization_policies.mcp)
        audiences:
          - &resource https://mcp.perryhuynh.com/mcp
        jwks:
          backendRef:
            kind: Service
            name: authelia
            namespace: security
            port: 80
          jwksPath: jwks.json
        # served at /.well-known/oauth-protected-resource/mcp/authtest. resource stays
        # the production URL: MCP clients accept a resource that is a path prefix of
        # the server URL, so test tokens carry the same audience as production.
        # authorization_servers defaults to the issuer since no provider is set.
        resourceMetadata:
          resource: *resource
          scopesSupported: ["openid", "profile", "groups", "offline_access"]
          bearerMethodsSupported: ["header"]
      authorization:
        # same backstop as mcp-backend
        action: Deny
        policy:
          matchExpressions:
            - 'mcp.tool.name.matches("(^|_)(create|update|delete|remove|apply|patch|scale|restart|suspend|resume|reconcile|exec|install|uninstall)(_|$)")'
