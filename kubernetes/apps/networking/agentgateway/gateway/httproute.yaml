---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp
spec:
  parentRefs:
    - name: mcp
      namespace: networking
      sectionName: https
  hostnames:
    - mcp.perryhuynh.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /mcp
        # OAuth discovery for MCP clients; agentgateway answers these itself
        - path:
            type: PathPrefix
            value: /.well-known/oauth-protected-resource
        - path:
            type: PathPrefix
            value: /.well-known/oauth-authorization-server
      backendRefs:
        - name: mcp
          group: agentgateway.dev
          kind: AgentgatewayBackend
