---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp
spec:
  parentRefs:
    - name: mcp
      namespace: networking
      sectionName: https
  hostnames:
    - mcp.perryhuynh.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /mcp
      backendRefs:
        - name: mcp
          group: agentgateway.dev
          kind: AgentgatewayBackend
    # TEMPORARY: Strict Authelia auth test; longer prefixes win over /mcp above.
    # The well-known paths are the OAuth discovery documents agentgateway serves
    # for this backend.
    - matches:
        - path:
            type: PathPrefix
            value: /mcp/authtest
        - path:
            type: PathPrefix
            value: /.well-known/oauth-protected-resource/mcp/authtest
        - path:
            type: PathPrefix
            value: /.well-known/oauth-authorization-server/mcp/authtest
      backendRefs:
        - name: mcp-authtest
          group: agentgateway.dev
          kind: AgentgatewayBackend
