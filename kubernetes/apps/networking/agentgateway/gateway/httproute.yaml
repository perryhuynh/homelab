---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp
spec:
  parentRefs:
    - name: mcp
      namespace: networking
      sectionName: https
  hostnames:
    - mcp.perryhuynh.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /mcp
      backendRefs:
        - name: mcp
          group: agentgateway.dev
          kind: AgentgatewayBackend
    # OAuth protected resource metadata for /mcp, served by agentgateway; the 401
    # from /mcp points clients here to start the Authelia login
    - matches:
        - path:
            type: Exact
            value: /.well-known/oauth-protected-resource/mcp
      backendRefs:
        - name: mcp
          group: agentgateway.dev
          kind: AgentgatewayBackend
