---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: agentgateway-crds
spec:
  interval: 1h
  chart:
    kind: OCIRepository
    spec:
      interval: 15m
      ref:
        # renovate: datasource=docker depName=cr.agentgateway.dev/charts/agentgateway-crds
        tag: v1.7.0
        # chart is not cosign-signed; pin by digest so a re-pushed tag cannot silently
        # deploy unreviewed CRDs (renovate tracks via the tag above)
        digest: sha256:946b739c0fcda4d47a72d1589d184b6fd507772e733cbedf02789bafd0468064
      url: oci://cr.agentgateway.dev/charts/agentgateway-crds
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values: {}
