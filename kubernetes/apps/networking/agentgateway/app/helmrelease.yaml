---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: agentgateway
spec:
  interval: 1h
  chart:
    kind: OCIRepository
    spec:
      interval: 15m
      ref:
        # renovate: datasource=docker depName=cr.agentgateway.dev/charts/agentgateway
        tag: v1.7.0
        # chart is not cosign-signed; pin by digest so a re-pushed tag cannot silently
        # deploy unreviewed control-plane code (renovate tracks via the tag above)
        digest: sha256:40340d639e35206317c934e9af3e29575cf7c5377b2940679732baac6e108c15
      url: oci://cr.agentgateway.dev/charts/agentgateway
  dependsOn:
    - name: agentgateway-crds
  values: {}
