---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cloudflared
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: cloudflared
  ingress:
    # Kubelet probes hit /ready on the metrics listener.
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: prometheus
            app.kubernetes.io/instance: kube-prometheus-stack
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # Replies from the Cloudflare edge to cloudflared's tunnel connections.
    - fromCIDR: &edge
        - 198.41.192.0/24
        - 198.41.200.0/24
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    # Origin for every tunnel hostname.
    - toEndpoints:
        - matchLabels:
            gateway.envoyproxy.io/owning-gateway-name: envoy-external
      toPorts:
        - ports:
            - port: "10443"
              protocol: TCP
    # Cloudflare edge (region1/region2.v2.argotunnel.com): QUIC, with HTTP/2
    # over TCP as the fallback. No 443 egress: api.cloudflare.com only serves
    # update checks (NO_AUTOUPDATE is set), so its startup precheck logs a
    # non-fatal FAIL.
    - toCIDR: *edge
      toPorts:
        - ports:
            - port: "7844"
              protocol: ANY
