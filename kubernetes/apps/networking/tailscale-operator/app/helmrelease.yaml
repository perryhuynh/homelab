---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale-operator
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: tailscale-operator
  values:
    apiServerProxyConfig:
      mode: "true"
    operatorConfig:
      logging: "debug"
      # tsnet state lives in the operator Secret (kubestore); $HOME/.config only holds
      # logs and caches. HOME=/tmp because /root is root-only and the chart has no
      # extra volumes, so the root filesystem stays writable.
      extraEnv:
        - name: HOME
          value: /tmp
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      image:
        repository: ghcr.io/tailscale/k8s-operator
    proxyConfig:
      image:
        repository: ghcr.io/tailscale/tailscale
