---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: echo
spec:
  interval: 1h
  chart:
    kind: OCIRepository
    spec:
      interval: 15m
      ref:
        tag: 0.2.7
      url: oci://ghcr.io/home-operations/charts/echo
      verify:
        provider: cosign
        matchOIDCIdentity:
          - issuer: "^https://token.actions.githubusercontent.com$"
            subject: "^https://github.com/home-operations/echo.*$"
  values:
    replicaCount: 2
    config:
      kubernetes: false
      trustedProxies:
        - 10.42.0.0/16
    httpRoute:
      enabled: true
      hostnames:
        - "{{ .Release.Name }}.perryhuynh.com"
      parentRefs:
        - name: envoy-external
          namespace: networking
          sectionName: https
    monitoring:
      serviceMonitor:
        enabled: true
    resources:
      requests:
        cpu: 10m
      limits:
        memory: 64Mi
  postRenderers:
    - kustomize:
        patches:
          # Echo also returns the OS hostname independently of Kubernetes metadata.
          - target:
              kind: Deployment
              name: echo
            patch: |
              - op: add
                path: /spec/template/spec/hostname
                value: echo
