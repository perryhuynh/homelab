---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app home-assistant-mcp
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: *app
  values:
    controllers:
      home-assistant-mcp:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/homeassistant-ai/ha-mcp
              tag: 9.2.0@sha256:9de5bf6c4216142fdffe862900abe72dac8dfe9621dd0b2b050d132372b676ba
            command: ["ha-mcp-web"]
            env:
              FASTMCP_CHECK_FOR_UPDATES: "off"
              HA_MCP_CONFIG_DIR: /config
              HA_MCP_DISABLE_SETTINGS_UI: true
              HA_MCP_DISABLE_UPDATE_CHECK: true
              HOMEASSISTANT_URL: http://home-assistant-app.home.svc.cluster.local:8123
              MCP_HEALTHZ: true
              MCP_HOST: 0.0.0.0
              MCP_PORT: &port 8086
              # global read-only: blocks write tools on every endpoint, including /mcp
              # called directly on the Service, not just the gateway's /mcp/readonly
              READ_ONLY_MODE: true
              TZ: America/Los_Angeles
            envFrom:
              - secretRef:
                  name: *app
            probes:
              liveness:
                enabled: true
                spec:
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
            resources:
              limits:
                memory: 512Mi
              requests:
                cpu: 10m
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
    service:
      app:
        ports:
          http:
            port: *port
    persistence:
      config:
        type: emptyDir
