---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: home-assistant
spec:
  description: Only envoy-internal and ha-mcp may reach Home Assistant and code-server over the pod network
  # Covers eth0 only; the Multus IoT interface (eth1) bypasses Cilium.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/controller: home-assistant
  ingress:
    # kubelet probes
    - fromEntities:
        - host
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: networking
            gateway.envoyproxy.io/owning-gateway-name: envoy-internal
      toPorts:
        - ports:
            - port: "8123"
              protocol: TCP
            # code-server: unauthenticated, so only behind the Authelia SecurityPolicy
            - port: "12321"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: home
            app.kubernetes.io/name: home-assistant-mcp
      toPorts:
        - ports:
            - port: "8123"
              protocol: TCP
    # Replies to Home Assistant's own outbound DNS and MQTT connections. Limited
    # to the Linux ephemeral port range so these peers cannot open new
    # connections to 8123 or code-server on 12321.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: database
            app.kubernetes.io/name: mosquitto
      toPorts:
        - ports:
            - port: "32768"
              endPort: 60999
              protocol: ANY
