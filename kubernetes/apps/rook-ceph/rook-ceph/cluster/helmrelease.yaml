---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-cluster
spec:
  interval: 1h
  timeout: 15m
  chartRef:
    kind: OCIRepository
    name: rook-ceph-cluster
  values:
    monitoring:
      enabled: true
      createPrometheusRules: true
    route:
      dashboard:
        host:
          name: rook.perryhuynh.com
          path: /
          pathType: PathPrefix
        parentRefs:
          - name: envoy-internal
            namespace: networking
            sectionName: https
    toolbox:
      enabled: true
    cephClusterSpec:
      cephConfig:
        global:
          bdev_enable_discard: "true" # quote
          bdev_async_discard_threads: "1" # quote
          osd_class_update_on_start: "false" # quote
          device_failure_prediction_mode: local # requires mgr module
        mgr:
          # Ceph v20.2.2: rook module logs full list_namespaced_pod bodies into
          # log_max_recent (daemon default 10000), which OOMs the mgr.
          # Bound the ring buffer until fixed in a later Ceph release.
          # https://github.com/rook/rook/issues/17786
          log_max_recent: "100" # quote
      cleanupPolicy:
        wipeDevicesFromOtherClusters: true
      crashCollector:
        disable: false
      csi:
        readAffinity:
          enabled: true
      dashboard:
        enabled: true
        urlPrefix: /
        ssl: false
        prometheusEndpoint: http://victoria-metrics.observability.svc.cluster.local:8428
      healthCheck:
        # Unresolvable while CSI keys stay on aes (kernel 7.0+ required for
        # aes256k) and allowedCiphers therefore cannot be narrowed.
        # https://rook.io/docs/rook/latest/Storage-Configuration/Advanced/cephx-key-rotation/
        muteHealthWarning:
          AUTH_INSECURE_ROTATING_SERVICE_KEY_TYPE:
            policy: mute
          AUTH_INSECURE_CLIENT_KEY_TYPE:
            policy: mute
          AUTH_INSECURE_KEYS_ALLOWED:
            policy: mute
          AUTH_INSECURE_KEYS_CREATABLE:
            policy: mute
      mgr:
        modules:
          - name: diskprediction_local
            enabled: true
          - name: insights
            enabled: true
          - name: pg_autoscaler
            enabled: true
          - name: rook
            enabled: true
      resources:
        mgr:
          limits:
            memory: 2Gi
          requests:
            cpu: 100m
            memory: 2Gi
        osd:
          limits:
            memory: 8Gi
          requests:
            cpu: 500m
            memory: 8Gi
      network:
        provider: host
        connections:
          requireMsgr2: true
      security:
        cephx:
          # CVE-2025-30156: rotate core daemon keys to aes256k
          daemon:
            keyRotationPolicy: KeyGeneration
            keyGeneration: 2
          csi:
            keyType: aes # aes256k requires kernel 7.0+
      storage:
        useAllNodes: false
        useAllDevices: false
        config:
          osdsPerDevice: "1"
        nodes:
          # NUCS
          - name: choi-yena
            devicePathFilter: &nucDeviceFilter /dev/disk/by-id/nvme-Micron_7450_MTFDKBA960TFR_.*
          - name: jo-yuri
            devicePathFilter: *nucDeviceFilter
          - name: kim-chaewon
            devicePathFilter: *nucDeviceFilter
          # MS-01
          - name: wizone
            devices:
              - name: /dev/disk/by-id/nvme-SAMSUNG_MZQL21T9HCJR-00A07_S64GNE0T303152
    cephBlockPools:
      - name: ceph-blockpool
        spec:
          failureDomain: host
          replicated:
            size: 3
        storageClass:
          enabled: true
          name: ceph-block
          isDefault: true
          reclaimPolicy: Delete
          allowVolumeExpansion: true
          volumeBindingMode: Immediate
          mountOptions:
            - "discard"
          parameters:
            compression_mode: aggressive
            compression_algorithm: zstd
            imageFormat: "2"
            imageFeatures: layering,fast-diff,object-map,deep-flatten,exclusive-lock
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/controller-expand-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
            csi.storage.k8s.io/node-stage-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/fstype: ext4
    cephBlockPoolsVolumeSnapshotClass:
      enabled: true
      name: csi-ceph-blockpool
      isDefault: false
      deletionPolicy: Delete
    # NOTE: After disabling the filesystem, the filesystem can be removed with the following commands:
    # ceph fs fail ceph-filesystem && ceph fs rm ceph-filesystem --yes-i-really-mean-it
    cephFileSystems: []
    cephObjectStores: []
