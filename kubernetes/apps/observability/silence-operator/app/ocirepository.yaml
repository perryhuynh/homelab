---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: silence-operator
spec:
  interval: 15m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 0.22.0
  url: oci://gsoci.azurecr.io/charts/giantswarm/silence-operator
  verify:
    provider: cosign
    # Giant Swarm signs from CircleCI; the subject is the project's pipeline
    # definition URL, not a GitHub workflow.
    matchOIDCIdentity:
      - issuer: "^https://oidc.circleci.com$"
        subject: "^https://circleci.com/api/v2/projects/c8f4d22e-ef11-47ef-ae72-71c531dbae88/.*$"
