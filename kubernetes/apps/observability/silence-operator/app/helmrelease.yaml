---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: silence-operator
spec:
  interval: 1h
  chart:
    kind: OCIRepository
    spec:
      interval: 15m
      ref:
        tag: 0.22.0
      url: oci://gsoci.azurecr.io/charts/giantswarm/silence-operator
      verify:
        provider: cosign
        # Giant Swarm signs from CircleCI; the subject is the project's pipeline
        # definition URL, not a GitHub workflow.
        matchOIDCIdentity:
          - issuer: "^https://oidc.circleci.com$"
            subject: "^https://circleci.com/api/v2/projects/c8f4d22e-ef11-47ef-ae72-71c531dbae88/.*$"
  values:
    alertmanagerAddress: http://kube-prometheus-stack-alertmanager:9093
    networkPolicy:
      enabled: false
