---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app grafana-mcp
spec:
  interval: 1h
  chart:
    kind: OCIRepository
    spec:
      interval: 15m
      ref:
        tag: 0.38.0
      url: oci://ghcr.io/grafana-community/helm-charts/grafana-mcp
  values:
    extraArgs:
      - --disable-write
      - --transport=streamable-http
      - --endpoint-path=/mcp
      - --address=0.0.0.0:8000
      # mcp-grafana >=0.17.1 blocks DNS rebinding by matching Host exactly (port
      # included); agentgateway v1.7 sends the Service hostname without :8000.
      # This flag replaces the chart's list, so keep localhost:8000 for the
      # chart's liveness probe (Host: localhost:8000).
      - --allowed-hosts=localhost:8000,grafana-mcp.observability.svc.cluster.local,grafana-mcp.observability.svc.cluster.local:8000
    grafana:
      apiKeySecret:
        name: grafana-mcp-token
        key: token
      url: http://grafana-service.observability.svc.cluster.local:3000
    # agentgateway sends this as `Authorization: Bearer <token>` on the grafana MCP target
    serverAuth:
      tokenSecret:
        name: grafana-mcp-server-token
        key: token
    image:
      registry: mirror.gcr.io
    podAnnotations:
      reloader.stakater.com/auto: "true"
    resources:
      limits:
        memory: 128Mi
      requests:
        cpu: 10m
