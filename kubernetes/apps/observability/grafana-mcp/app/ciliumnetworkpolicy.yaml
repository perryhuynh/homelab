---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: grafana-mcp
spec:
  description: Only the agentgateway mcp proxy may reach grafana-mcp
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: grafana-mcp
  ingress:
    # Kubelet probes.
    - fromEntities:
        - host
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: networking
            gateway.networking.k8s.io/gateway-name: mcp
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
