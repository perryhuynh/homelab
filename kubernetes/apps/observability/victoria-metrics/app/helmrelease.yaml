---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics
spec:
  chartRef:
    kind: OCIRepository
    name: victoria-metrics
  interval: 1h
  values:
    global:
      image:
        registry: mirror.gcr.io
    server:
      extraArgs:
        dedup.minScrapeInterval: 60s
      fullnameOverride: victoria-metrics
      retentionPeriod: 400d
      persistentVolume:
        storageClassName: ceph-block
        size: 200Gi
      podSecurityContext:
        enabled: true
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        # existing /storage files are root-owned; fsGroup grants group write once
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      securityContext:
        enabled: true
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
      resources:
        limits:
          memory: 8Gi
        requests:
          cpu: 10m
      route:
        enabled: true
        hostnames:
          - victoria-metrics.perryhuynh.com
        parentRefs:
          - name: envoy-internal
            namespace: networking
            sectionName: https
      serviceMonitor:
        enabled: true
