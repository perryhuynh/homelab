---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: victoria-metrics-mcp
spec:
  description: Only the agentgateway mcp proxy may reach victoria-metrics-mcp
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: victoria-metrics-mcp
  ingress:
    # Kubelet probes.
    - fromEntities:
        - host
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: networking
            gateway.networking.k8s.io/gateway-name: mcp
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # Replies to this pod's own outbound connections. Cilium denies replies from
    # same-node peers under an ingress policy, so allow the ephemeral port range.
    # Peers still cannot open new connections to the listening ports.
    - fromEntities:
        - cluster
      toPorts:
        - ports:
            - port: "32768"
              endPort: 60999
              protocol: TCP
            - port: "32768"
              endPort: 60999
              protocol: UDP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: victoria-metrics-single
      toPorts:
        - ports:
            - port: "8428"
              protocol: TCP
