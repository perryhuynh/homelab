---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# Only the agentgateway MCP proxy may reach this server, so MCP calls cannot bypass
# the gateway's Authelia authentication and tool authorization.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: victoria-metrics-mcp
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: victoria-metrics-mcp
      app.kubernetes.io/instance: victoria-metrics-mcp
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: networking
            gateway.networking.k8s.io/gateway-name: mcp
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
