---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics-mcp
spec:
  chart:
    kind: OCIRepository
    spec:
      interval: 15m
      ref:
        tag: 0.5.0
      url: oci://ghcr.io/victoriametrics/helm-charts/victoria-metrics-mcp
      verify:
        provider: cosign
        matchOIDCIdentity:
          - issuer: "^https://token.actions.githubusercontent.com$"
            subject: "^https://github.com/VictoriaMetrics/helm-charts.*$"
  interval: 1h
  values:
    serviceAccount:
      automount: false
    vm:
      type: single
      entrypoint: http://victoria-metrics.observability.svc.cluster.local:8428
    mcp:
      mode: http
      disable:
        # resources/list is ~12MB of docs, over agentgateway's 2MB buffer, which
        # fails resources/list for the whole /mcp backend; the documentation tool
        # still serves the same docs
        resources: true
    resources:
      limits:
        memory: 1Gi
      requests:
        cpu: 10m
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 65534
      runAsGroup: 65534
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
      readOnlyRootFilesystem: true
