---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/scheduling.k8s.io/priorityclass_v1.json
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: victoria-logs-collector
# Above default workloads (0) so the agent is scheduled first, far below
# system-cluster-critical (2000000000) so it never outranks storage or
# networking. Never preempt: a full node delays log collection rather than
# evicting a running workload.
value: 1000000
preemptionPolicy: Never
globalDefault: false
description: Node log collector; scheduled ahead of workloads without preempting them.
