---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-logs-mcp
spec:
  chart:
    kind: OCIRepository
    spec:
      interval: 15m
      ref:
        tag: 0.2.0
      url: oci://ghcr.io/victoriametrics/helm-charts/victoria-logs-mcp
      verify:
        provider: cosign
        matchOIDCIdentity:
          - issuer: "^https://token.actions.githubusercontent.com$"
            subject: "^https://github.com/VictoriaMetrics/helm-charts.*$"
  interval: 1h
  values:
    serviceAccount:
      automount: false
    vl:
      entrypoint: http://victoria-logs.observability.svc.cluster.local:9428
    mcp:
      mode: http
    resources:
      limits:
        memory: 512Mi
      requests:
        cpu: 10m
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 65534
      runAsGroup: 65534
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
      readOnlyRootFilesystem: true
