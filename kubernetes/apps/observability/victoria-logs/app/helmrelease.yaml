---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-logs
spec:
  chart:
    kind: OCIRepository
    spec:
      interval: 15m
      ref:
        tag: 0.13.14
      url: oci://ghcr.io/victoriametrics/helm-charts/victoria-logs-single
      verify:
        provider: cosign
        matchOIDCIdentity:
          - issuer: "^https://token.actions.githubusercontent.com$"
            subject: "^https://github.com/VictoriaMetrics/helm-charts.*$"
  interval: 1h
  values:
    global:
      image:
        registry: mirror.gcr.io
    server:
      fullnameOverride: victoria-logs
      retentionPeriod: 90d
      # UniFi syslog is received and parsed by the opentelemetry "syslog"
      # collector, which ships it here over OTLP.
      persistentVolume:
        enabled: true
        storageClassName: ceph-block
        size: 50Gi
      resources:
        limits:
          memory: 4Gi
        requests:
          cpu: 10m
      route:
        enabled: true
        hostnames:
          - logs.perryhuynh.com
        parentRefs:
          - name: envoy-internal
            namespace: networking
            sectionName: https
      serviceMonitor:
        enabled: true
    dashboards:
      enabled: true
      grafanaOperator:
        enabled: true
        spec:
          folder: observability
