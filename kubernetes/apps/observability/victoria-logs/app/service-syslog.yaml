---
apiVersion: v1
kind: Service
metadata:
  name: victoria-logs-syslog
  annotations:
    external-dns.kubernetes.io/hostname: unifi-syslog.internal
    lbipam.cilium.io/ips: 192.168.20.205
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  ports:
    - name: syslog
      port: 514
      targetPort: 5514
      protocol: UDP
  selector:
    app.kubernetes.io/component: server
    app.kubernetes.io/instance: victoria-logs
    app.kubernetes.io/name: victoria-logs-single
