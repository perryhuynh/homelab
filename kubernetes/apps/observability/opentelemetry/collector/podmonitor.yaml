---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/podmonitor_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: otel-log-collectors
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: opentelemetry-collector
      kustomize.toolkit.fluxcd.io/name: opentelemetry-collector
  podMetricsEndpoints:
    - port: metrics
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node
        - sourceLabels: [__meta_kubernetes_pod_label_app_kubernetes_io_instance]
          regex: 'observability\.(.+)'
          replacement: '$1'
          targetLabel: collector
