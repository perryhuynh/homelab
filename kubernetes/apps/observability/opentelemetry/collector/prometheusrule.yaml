---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: otel-log-collectors
spec:
  groups:
    - name: otel-log-collectors
      rules:
        - alert: OTelLogCollectorScrapeMissing
          expr: |
            kube_pod_status_phase{namespace="observability",pod=~"(events|talos-logs|unifi-syslog|truenas-syslog)-collector-.+",phase="Running"} == 1
              unless on (namespace, pod)
            (up{job="observability/otel-log-collectors"} == 1)
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: 'Prometheus cannot scrape {{ $labels.pod }}'
        - alert: OTelLogCollectorDeliverySilent
          expr: |
            up{job="observability/otel-log-collectors"} == 1
              unless on (namespace, pod)
            (increase(otelcol_exporter_sent_log_records{job="observability/otel-log-collectors",exporter="otlp_http"}[5m]) > 0)
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: '{{ $labels.collector }} on {{ $labels.node }} has stopped delivering logs'
            description: 'The collector is reachable but has reported no successful log deliveries to VictoriaLogs. Check incoming records, pipeline filters, and exporter errors.'
