---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: opentelemetry-collector-rules
spec:
  groups:
    - name: opentelemetry-collector.rules
      rules:
        - alert: OtelCollectorDown
          expr: |
            up{job=~".+-collector-monitoring"} == 0
          for: 5m
          annotations:
            summary: >-
              OpenTelemetry collector {{ $labels.pod }} is down
          labels:
            severity: critical

        # Name regex matches with or without the _total suffix. The failure
        # counters differ only by name, so they are summed per exporter before
        # increase(); applying it to the raw regex selector would drop __name__
        # and fail on duplicate label sets. A counter appearing non-zero raises
        # the sum, which the subquery sees. The `unless ... offset` arm covers
        # an exporter's first failure, when the summed series itself is new.
        # Loss is irreversible, so there is no hold.
        - alert: OtelCollectorDroppingData
          expr: |
            increase(
              (sum by (job, pod, exporter) ({__name__=~"otelcol_exporter_(send|enqueue)_failed_.+"}))[10m:30s]
            ) > 0
            or
            (
              sum by (job, pod, exporter) ({__name__=~"otelcol_exporter_(send|enqueue)_failed_.+"}) > 0
                unless
              sum by (job, pod, exporter) ({__name__=~"otelcol_exporter_(send|enqueue)_failed_.+"} offset 10m)
            )
          annotations:
            summary: >-
              OpenTelemetry collector {{ $labels.pod }} exporter {{ $labels.exporter }}
              dropped data in the last 10m
          labels:
            severity: critical

        - alert: OtelCollectorQueueFilling
          expr: |
            max by (job, pod, exporter, data_type) (
              otelcol_exporter_queue_size / otelcol_exporter_queue_capacity
            ) > 0.8
          for: 15m
          annotations:
            summary: >-
              OpenTelemetry collector {{ $labels.pod }} exporter {{ $labels.exporter }}
              queue is {{ $value | humanizePercentage }} full
          labels:
            severity: warning

        - alert: OtelCollectorRefusingData
          expr: |
            sum by (job, pod, receiver) (
              rate({__name__=~"otelcol_receiver_refused_.+"}[5m])
            ) > 0
          for: 5m
          annotations:
            summary: >-
              OpenTelemetry collector {{ $labels.pod }} receiver {{ $labels.receiver }}
              is refusing data
          labels:
            severity: warning
