---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/opentelemetry.io/opentelemetrycollector_v1beta1.json
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: events
spec:
  resources:
    limits:
      memory: 512Mi
    requests:
      cpu: 10m
  config:
    receivers:
      k8s_events:
        auth_type: serviceAccount
    processors:
      batch: {}
      groupbyattrs:
        keys:
          - k8s.event.reason
          - k8s.object.name
          - k8s.namespace.name
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 15
    exporters:
      debug:
        verbosity: detailed
      otlp_http:
        logs_endpoint: http://victoria-logs.observability.svc.cluster.local:9428/insert/opentelemetry/v1/logs
        headers:
          VL-Stream-Fields: k8s.namespace.name,k8s.event.reason
    service:
      pipelines:
        logs:
          receivers:
            - k8s_events
          processors:
            - memory_limiter
            - groupbyattrs
            - batch
          exporters:
            - otlp_http
      telemetry:
        metrics:
          readers:
            - periodic:
                exporter:
                  otlp:
                    protocol: http/protobuf
                    endpoint: http://victoria-metrics.observability.svc.cluster.local:8428/opentelemetry/v1/metrics
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/opentelemetry.io/opentelemetrycollector_v1beta1.json
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: unifi-syslog
spec:
  replicas: 1
  ports:
    - name: syslog
      port: 5514
      protocol: UDP
  resources:
    limits:
      memory: 512Mi
    requests:
      cpu: 10m
  config:
    receivers:
      syslog:
        protocol: rfc3164
        location: America/Los_Angeles
        # UniFi sends some CEF events without the <PRI> header.
        allow_skip_pri_header: true
        udp:
          listen_address: 0.0.0.0:5514
          one_log_per_packet: true
    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 15
      # UDM housekeeping that repeats thousands of times a day and is never useful.
      filter/noise:
        error_mode: ignore
        logs:
          log_record:
            - 'IsMatch(log.body, "earlyoom\\[|udapi_lu_set_inform_interval|config-migrate-helper|systemd-timedated|org\\.freedesktop\\.timedate1|\\[Statistic\\] Version=|Background sync: Fetching|stime is unknown")'
      transform/classify:
        error_mode: silent
        log_statements:
          - statements:
              - 'set(log.attributes["log.type"], "system")'
              - 'set(log.attributes["log.type"], "event") where IsMatch(log.body, "CEF:\\d+\\|")'
              - 'set(log.attributes["log.type"], "firewall") where IsMatch(log.body, "\\] DESCR=\"")'
              - 'set(log.attributes["log.type"], "dns") where IsMatch(log.body, "\"type\":\"dns")'
      # UniFi events (CEF): header into cef.*, extensions into unifi.* / cef.*, msg into the body.
      transform/event:
        error_mode: ignore
        log_statements:
          - conditions:
              - 'log.attributes["log.type"] == "event"'
            statements:
              - 'merge_maps(log.cache, ExtractPatterns(log.body, "CEF:\\d+\\|[^|]*\\|[^|]*\\|[^|]*\\|(?P<class_id>[^|]*)\\|(?P<name>[^|]*)\\|(?P<severity>[^|]*)\\|(?P<ext>.*)$"), "upsert")'
              - 'set(log.attributes["cef.name"], log.cache["name"])'
              - 'set(log.attributes["cef.class_id"], log.cache["class_id"])'
              - 'set(log.attributes["cef.severity"], log.cache["severity"])'
              # Mark each " key=" boundary; escaped "\=" inside values never matches.
              - 'replace_pattern(log.cache["ext"], " ([A-Za-z0-9_]+)=", "|~|$$1=")'
              - 'set(log.cache["kv"], ParseKeyValue(log.cache["ext"], "=", "|~|"))'
              - 'replace_all_patterns(log.cache["kv"], "value", "\\\\([=\\\\])", "$$1")'
              - 'replace_all_patterns(log.cache["kv"], "key", "^([a-z][A-Za-z0-9]*)$", "cef.$$1")'
              - 'replace_all_patterns(log.cache["kv"], "key", "^UNIFI", "unifi.")'
              - 'set(log.body, log.cache["kv"]["cef.msg"]) where log.cache["kv"]["cef.msg"] != nil'
              - 'delete_key(log.cache["kv"], "cef.msg")'
              - 'merge_maps(log.attributes, log.cache["kv"], "upsert")'
              - 'set(log.attributes["log.parse_failed"], true) where log.cache["name"] == nil'
      # Per-policy firewall logging: [LAN_WAN-D-10000] DESCR="rule" IN= OUT= ... SRC= DST= ... PROTO= SPT= DPT=
      transform/firewall:
        error_mode: ignore
        log_statements:
          - conditions:
              - 'log.attributes["log.type"] == "firewall"'
            statements:
              - 'merge_maps(log.cache, ExtractPatterns(log.body, "\\[(?P<chain>[^\\]]+)\\] DESCR=\"(?P<rule>[^\"]*)\" IN=(?P<in>\\S*) OUT=(?P<out>\\S*) .*?SRC=(?P<src>\\S+) DST=(?P<dst>\\S+) .*?PROTO=(?P<proto>\\S+)(?: SPT=(?P<spt>\\d+) DPT=(?P<dpt>\\d+))?"), "upsert")'
              - 'set(log.attributes["firewall.rule"], log.cache["rule"])'
              - 'set(log.attributes["firewall.chain"], log.cache["chain"])'
              - 'set(log.attributes["firewall.action"], "block") where IsMatch(log.cache["chain"], "-D-")'
              - 'set(log.attributes["firewall.action"], "allow") where IsMatch(log.cache["chain"], "-A-")'
              - 'set(log.attributes["firewall.action"], "reject") where IsMatch(log.cache["chain"], "-R-")'
              - 'set(log.attributes["firewall.in"], log.cache["in"])'
              - 'set(log.attributes["firewall.out"], log.cache["out"])'
              - 'set(log.attributes["source.address"], log.cache["src"])'
              - 'set(log.attributes["destination.address"], log.cache["dst"])'
              - 'set(log.attributes["network.transport"], ConvertCase(log.cache["proto"], "lower"))'
              - 'set(log.attributes["source.port"], log.cache["spt"]) where log.cache["spt"] != ""'
              - 'set(log.attributes["destination.port"], log.cache["dpt"]) where log.cache["dpt"] != ""'
              - 'set(log.body, Format("%s: %s %s %s:%s -> %s:%s", [log.cache["rule"], log.attributes["firewall.action"], log.attributes["network.transport"], log.cache["src"], log.cache["spt"], log.cache["dst"], log.cache["dpt"]]))'
              - 'set(log.attributes["log.parse_failed"], true) where log.cache["rule"] == nil'
      # UDM DNS ad-block hits: coredns[pid]: {"type":"dnsAdBlock","category":...,"domain":...,"mac":...}
      transform/dns:
        error_mode: ignore
        log_statements:
          - conditions:
              - 'log.attributes["log.type"] == "dns"'
            statements:
              - 'merge_maps(log.cache, ExtractPatterns(log.body, "coredns\\[\\d+\\]: (?P<json>\\{.*\\})"), "upsert")'
              - 'set(log.cache["dns"], ParseJSON(log.cache["json"]))'
              - 'set(log.attributes["dns.type"], log.cache["dns"]["type"])'
              - 'set(log.attributes["dns.category"], log.cache["dns"]["category"])'
              - 'set(log.attributes["dns.question.name"], log.cache["dns"]["domain"])'
              - 'set(log.attributes["client.address"], log.cache["dns"]["src_ip"])'
              - 'set(log.attributes["client.mac"], log.cache["dns"]["mac"])'
              - 'set(log.body, Format("%s %s: %s from %s", [log.cache["dns"]["type"], log.cache["dns"]["category"], log.cache["dns"]["domain"], log.cache["dns"]["src_ip"]]))'
              - 'set(log.attributes["log.parse_failed"], true) where log.cache["dns"] == nil'
      transform/system:
        error_mode: silent
        log_statements:
          - conditions:
              - 'log.attributes["log.type"] == "system"'
            statements:
              - 'set(log.body, log.attributes["message"]) where log.attributes["message"] != nil'
              # Switches and PDUs send appname "<mac>,<model>-<version>" and the message
              # starts with ": prog[pid]: ...".
              - 'merge_maps(log.cache, ExtractPatterns(log.attributes["appname"], "^[0-9a-f]{12},(?P<model>.+?)-(?P<version>\\d+\\.\\d+\\.\\d+\\S*)$"), "upsert") where log.attributes["appname"] != nil'
              - 'set(log.attributes["unifi.device.model"], log.cache["model"]) where log.cache["model"] != nil'
              - 'set(log.attributes["unifi.device.version"], log.cache["version"]) where log.cache["version"] != nil'
              - 'delete_key(log.attributes, "appname") where log.cache["model"] != nil'
              - 'replace_pattern(log.body, "^:\\s+", "")'
              # The UDM repeats its hostname before the program: "UDM-Pro-Max /usr/bin/prog[pid]: ..."
              - 'replace_pattern(log.body, "^[A-Za-z0-9._-]+ ((?:\\S*/)?[A-Za-z0-9_.-]+(?:\\[\\d+\\])?: )", "$$1")'
              - 'merge_maps(log.cache, ExtractPatterns(log.body, "^(?:\\S*/)?(?P<program>[A-Za-z0-9_.-]+)(?:\\[\\d+\\])?: "), "upsert")'
              - 'set(log.attributes["process.executable.name"], log.cache["program"]) where log.cache["program"] != nil'
      transform/cleanup:
        error_mode: silent
        log_statements:
          - statements:
              - 'delete_key(log.attributes, "message")'
              - 'delete_key(log.attributes, "appname") where log.attributes["appname"] == log.attributes["hostname"]'
              - 'delete_key(log.attributes, "priority")'
              - 'delete_key(log.attributes, "facility")'
      resource:
        attributes:
          - key: service.name
            value: unifi
            action: upsert
      batch: {}
    exporters:
      otlp_http:
        logs_endpoint: http://victoria-logs.observability.svc.cluster.local:9428/insert/opentelemetry/v1/logs
        headers:
          VL-Stream-Fields: service.name,hostname,log.type
          VL-Ignore-Fields: scope.name,scope.version
    service:
      pipelines:
        logs:
          receivers:
            - syslog
          processors:
            - memory_limiter
            - filter/noise
            - transform/classify
            - transform/event
            - transform/firewall
            - transform/dns
            - transform/system
            - transform/cleanup
            - resource
            - batch
          exporters:
            - otlp_http
      telemetry:
        metrics:
          readers:
            - periodic:
                exporter:
                  otlp:
                    protocol: http/protobuf
                    endpoint: http://victoria-metrics.observability.svc.cluster.local:8428/opentelemetry/v1/metrics
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/opentelemetry.io/opentelemetrycollector_v1beta1.json
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: truenas-syslog
spec:
  replicas: 1
  ports:
    - name: syslog
      port: 5514
      protocol: TCP
  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: 10m
  config:
    receivers:
      # TrueNAS uses syslog-ng's syslog() driver: RFC 5424 with octet-counting
      # framing over TCP.
      syslog:
        protocol: rfc5424
        enable_octet_counting: true
        tcp:
          listen_address: 0.0.0.0:5514
          # TrueNAS's template ends each message with "\n" and counts it in the
          # octet length; trimming it makes every frame one byte short.
          preserve_trailing_whitespaces: true
    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 15
      transform/message:
        error_mode: ignore
        log_statements:
          - statements:
              - 'set(log.body, log.attributes["message"]) where log.attributes["message"] != nil'
              - 'replace_pattern(log.body, "\\s+$", "")'
              - 'set(log.attributes["process.executable.name"], log.attributes["appname"]) where log.attributes["appname"] != nil'
              - 'delete_key(log.attributes, "message")'
              - 'delete_key(log.attributes, "appname")'
              - 'delete_key(log.attributes, "priority")'
              - 'delete_key(log.attributes, "facility")'
              - 'delete_key(log.attributes, "version")'
      # Audit events (middleware, SMB, sudo) arrive as "@cee:{"TNAUDIT": {...}}".
      # svc_data and event_data are JSON documents encoded as strings.
      transform/audit:
        error_mode: ignore
        log_statements:
          - conditions:
              - 'IsMatch(log.body, "^@cee:\\{")'
            statements:
              - 'set(log.cache["a"], ParseJSON(Substring(log.body, 5, Len(log.body) - 5))["TNAUDIT"])'
              - 'set(log.attributes["log.parse_failed"], true) where log.cache["a"] == nil'
              - 'set(log.cache["ed"], ParseJSON(log.cache["a"]["event_data"])) where log.cache["a"] != nil and IsString(log.cache["a"]["event_data"]) and log.cache["a"]["event_data"] != "null"'
              - 'set(log.cache["sd"], ParseJSON(log.cache["a"]["svc_data"])) where log.cache["a"] != nil and IsString(log.cache["a"]["svc_data"]) and log.cache["a"]["svc_data"] != "null"'
              - 'set(log.attributes["truenas.audit.raw"], log.body) where log.cache["a"] != nil'
              - 'set(log.attributes["truenas.audit.event"], log.cache["a"]["event"]) where log.cache["a"] != nil'
              - 'set(log.attributes["truenas.audit.service"], log.cache["a"]["svc"]) where log.cache["a"] != nil'
              - 'set(log.attributes["truenas.audit.success"], log.cache["a"]["success"]) where log.cache["a"] != nil'
              - 'set(log.attributes["truenas.audit.session"], log.cache["a"]["sess"]) where log.cache["a"] != nil'
              - 'set(log.attributes["user.name"], log.cache["a"]["user"]) where log.cache["a"] != nil'
              - 'set(log.attributes["client.address"], log.cache["a"]["addr"]) where log.cache["a"] != nil'
              - 'set(log.attributes["truenas.audit.method"], log.cache["ed"]["method"]) where log.cache["ed"] != nil and log.cache["ed"]["method"] != nil'
              - 'set(log.attributes["truenas.audit.description"], log.cache["ed"]["description"]) where log.cache["ed"] != nil and log.cache["ed"]["description"] != nil'
              - 'set(log.attributes["truenas.audit.error"], log.cache["ed"]["error"]) where log.cache["ed"] != nil and log.cache["ed"]["error"] != nil'
              - 'set(log.attributes["truenas.audit.credentials"], log.cache["sd"]["credentials"]["credentials"]) where log.cache["sd"] != nil and log.cache["sd"]["credentials"] != nil'
              - 'set(log.attributes["truenas.audit.protocol"], log.cache["sd"]["protocol"]) where log.cache["sd"] != nil and log.cache["sd"]["protocol"] != nil'
              # "METHOD_CALL system.advanced.update by root from 192.168.1.23 (ok)"
              - 'set(log.body, Format("%s by %s from %s", [log.cache["a"]["event"], log.cache["a"]["user"], log.cache["a"]["addr"]])) where log.cache["a"] != nil'
              - 'set(log.body, Format("%s %s by %s from %s", [log.cache["a"]["event"], log.cache["ed"]["method"], log.cache["a"]["user"], log.cache["a"]["addr"]])) where log.cache["ed"] != nil and log.cache["ed"]["method"] != nil'
              - 'set(log.body, Concat([log.body, "(ok)"], " ")) where log.cache["a"] != nil and log.cache["a"]["success"] == true'
              - 'set(log.body, Concat([log.body, "(failed)"], " ")) where log.cache["a"] != nil and log.cache["a"]["success"] == false'
      resource:
        attributes:
          - key: service.name
            value: truenas
            action: upsert
      batch: {}
    exporters:
      otlp_http:
        logs_endpoint: http://victoria-logs.observability.svc.cluster.local:9428/insert/opentelemetry/v1/logs
        headers:
          VL-Stream-Fields: service.name,hostname,process.executable.name
          VL-Ignore-Fields: scope.name,scope.version
    service:
      pipelines:
        logs:
          receivers:
            - syslog
          processors:
            - memory_limiter
            - transform/message
            - transform/audit
            - resource
            - batch
          exporters:
            - otlp_http
      telemetry:
        metrics:
          readers:
            - periodic:
                exporter:
                  otlp:
                    protocol: http/protobuf
                    endpoint: http://victoria-metrics.observability.svc.cluster.local:8428/opentelemetry/v1/metrics
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/opentelemetry.io/opentelemetrycollector_v1beta1.json
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: unifi-netflow
spec:
  # NetFlow v9/IPFIX templates are cached per collector instance; a second
  # replica would drop flows until it saw its own templates.
  replicas: 1
  ports:
    - name: netflow
      port: 2055
      protocol: UDP
  resources:
    limits:
      memory: 512Mi
    requests:
      cpu: 10m
  config:
    receivers:
      netflow:
        scheme: netflow
        port: 2055
        sockets: 2
        workers: 4
        queue_size: 5000
    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 15
      # Cluster nodes, the Talos VIP and qBittorrent: torrent peers and node
      # traffic would drown out every other device.
      filter/cluster:
        error_mode: ignore
        logs:
          log_record:
            - 'IsMatch(log.attributes["source.address"], "^192\\.168\\.(1\\.2[0-4]|20\\.250)$")'
            - 'IsMatch(log.attributes["destination.address"], "^192\\.168\\.(1\\.2[0-4]|20\\.250)$")'
      # Known devices by IP (fixed IPs, LoadBalancer IPs, current DHCP leases).
      transform/names:
        error_mode: ignore
        log_statements:
          - statements:
              - 'set(log.attributes["source.name"], "UDM Pro Max") where log.attributes["source.address"] == "192.168.1.1"'
              - 'set(log.attributes["source.name"], "PiKVM") where log.attributes["source.address"] == "192.168.1.4"'
              - 'set(log.attributes["source.name"], "TESmart KVM") where log.attributes["source.address"] == "192.168.1.5"'
              - 'set(log.attributes["source.name"], "APC Smart UPS") where log.attributes["source.address"] == "192.168.1.6"'
              - 'set(log.attributes["source.name"], "UDM Pro Max") where log.attributes["source.address"] == "192.168.10.1"'
              - 'set(log.attributes["source.name"], "TrueNAS") where log.attributes["source.address"] == "192.168.10.10"'
              - 'set(log.attributes["source.name"], "TrueNAS IPMI") where log.attributes["source.address"] == "192.168.10.11"'
              - 'set(log.attributes["source.name"], "UDM Pro Max") where log.attributes["source.address"] == "192.168.20.1"'
              - 'set(log.attributes["source.name"], "agentgateway-mcp") where log.attributes["source.address"] == "192.168.20.67"'
              - 'set(log.attributes["source.name"], "mosquitto") where log.attributes["source.address"] == "192.168.20.101"'
              - 'set(log.attributes["source.name"], "envoy-internal") where log.attributes["source.address"] == "192.168.20.200"'
              - 'set(log.attributes["source.name"], "envoy-external") where log.attributes["source.address"] == "192.168.20.201"'
              - 'set(log.attributes["source.name"], "maddy-smtp") where log.attributes["source.address"] == "192.168.20.202"'
              - 'set(log.attributes["source.name"], "unifi-netflow") where log.attributes["source.address"] == "192.168.20.203"'
              - 'set(log.attributes["source.name"], "plex") where log.attributes["source.address"] == "192.168.20.204"'
              - 'set(log.attributes["source.name"], "unifi-syslog") where log.attributes["source.address"] == "192.168.20.205"'
              - 'set(log.attributes["source.name"], "truenas-syslog") where log.attributes["source.address"] == "192.168.20.206"'
              - 'set(log.attributes["source.name"], "UDM Pro Max") where log.attributes["source.address"] == "192.168.30.1"'
              - 'set(log.attributes["source.name"], "iPhone - Jason") where log.attributes["source.address"] == "192.168.30.139"'
              - 'set(log.attributes["source.name"], "iPhone - Lauren") where log.attributes["source.address"] == "192.168.30.200"'
              - 'set(log.attributes["source.name"], "Apple TV - Mom") where log.attributes["source.address"] == "192.168.30.225"'
              - 'set(log.attributes["source.name"], "g6-instant") where log.attributes["source.address"] == "192.168.30.251"'
              - 'set(log.attributes["source.name"], "UDM Pro Max") where log.attributes["source.address"] == "192.168.50.1"'
              - 'set(log.attributes["source.name"], "Home Assistant") where log.attributes["source.address"] == "192.168.50.2"'
              - 'set(log.attributes["source.name"], "cups") where log.attributes["source.address"] == "192.168.50.4"'
              - 'set(log.attributes["source.name"], "ratgdo") where log.attributes["source.address"] == "192.168.50.10"'
              - 'set(log.attributes["source.name"], "roborock") where log.attributes["source.address"] == "192.168.50.19"'
              - 'set(log.attributes["source.name"], "Chromecast - Dad") where log.attributes["source.address"] == "192.168.50.26"'
              - 'set(log.attributes["source.name"], "Chromecast") where log.attributes["source.address"] == "192.168.50.38"'
              - 'set(log.attributes["source.name"], "Kasa HS220 (.50)") where log.attributes["source.address"] == "192.168.50.50"'
              - 'set(log.attributes["source.name"], "Chromecast (Living Room)") where log.attributes["source.address"] == "192.168.50.51"'
              - 'set(log.attributes["source.name"], "TV - Living Room") where log.attributes["source.address"] == "192.168.50.61"'
              - 'set(log.attributes["source.name"], "Perry Ceiling Fan") where log.attributes["source.address"] == "192.168.50.106"'
              - 'set(log.attributes["source.name"], "ecobee") where log.attributes["source.address"] == "192.168.50.109"'
              - 'set(log.attributes["source.name"], "Ring Floodlight Cam") where log.attributes["source.address"] == "192.168.50.120"'
              - 'set(log.attributes["source.name"], "Perry Lights") where log.attributes["source.address"] == "192.168.50.140"'
              - 'set(log.attributes["source.name"], "Chromecast - Mom") where log.attributes["source.address"] == "192.168.50.152"'
