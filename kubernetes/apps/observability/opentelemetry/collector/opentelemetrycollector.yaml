---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/opentelemetry.io/opentelemetrycollector_v1beta1.json
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: events
spec:
  resources:
    limits:
      memory: 512Mi
    requests:
      cpu: 10m
  config:
    receivers:
      k8s_events:
        auth_type: serviceAccount
    processors:
      groupbyattrs:
        keys:
          - k8s.event.reason
          - k8s.object.name
          - k8s.namespace.name
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 15
    exporters:
      debug:
        verbosity: detailed
      otlp_http:
        endpoint: http://gateway-collector-headless.observability.svc.cluster.local:4318
        # Count the queue in records, not requests: this receiver submits
        # records one at a time, so 1000 requests (the default) would hold
        # only ~1000 records. In-memory, so sized under the memory limit.
        sending_queue:
          sizer: items
          queue_size: 50000
          batch: {}
    service:
      pipelines:
        logs:
          receivers:
            - k8s_events
          processors:
            - memory_limiter
            - groupbyattrs
          exporters:
            - otlp_http
      telemetry:
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/opentelemetry.io/opentelemetrycollector_v1beta1.json
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: filelog
spec:
  mode: daemonset
  resources:
    limits:
      memory: 1Gi
    requests:
      cpu: 10m
  serviceAccount: filelog-collector
  # Root is needed to write the checkpoint hostPath, which the kubelet creates
  # as root:root 0755. No capabilities or privilege escalation are granted.
  # The path sits under /var/mnt/extra because Talos only bind-mounts that
  # tree into the kubelet (talos/patches/all/09-kubelet-extra-mounts.yaml).
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - "ALL"
    readOnlyRootFilesystem: true
  podSecurityContext:
    runAsUser: 0
    runAsGroup: 0
  env:
    - name: KUBE_NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
  volumes:
    - name: varlogpods
      hostPath:
        path: /var/log/pods
    - name: storage
      hostPath:
        path: /var/mnt/extra/otelcol/filelog
        type: DirectoryOrCreate
  volumeMounts:
    - name: varlogpods
      mountPath: /var/log/pods
      readOnly: true
    - name: storage
      mountPath: /var/lib/otelcol/storage
  config:
    extensions:
      # Persists file read offsets and the export queue across restarts so a
      # rollout resumes where it stopped instead of skipping to the file end.
      file_storage:
        directory: /var/lib/otelcol/storage
    receivers:
      filelog:
        storage: file_storage
        include:
          - /var/log/pods/*/*/*.log
        exclude:
          # Exclude logs from all containers named otc-container
          - /var/log/pods/*/otc-container/*.log
        start_at: end
        include_file_path: true
        include_file_name: false
        operators:
          # parse container logs
          - type: container
            id: container-parser
          - type: json_parser
            on_error: send_quiet
    processors:
      k8s_attributes:
        auth_type: "serviceAccount"
        passthrough: false
        filter:
          # only retrieve pods running on the same node as the collector
          node_from_env_var: KUBE_NODE_NAME
        extract:
          # The attributes provided in 'metadata' will be added to associated resources
          metadata:
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.daemonset.name
            - k8s.deployment.name # Requires watching Deployment resources. To avoid this, use deployment_name_from_replicaset instead.
            - k8s.statefulset.name
            - k8s.namespace.name
            - k8s.node.name
            - k8s.pod.start_time
            - service.namespace
            - service.name
            - service.version
            - service.instance.id
          labels:
            # This label extraction rule takes the value 'app.kubernetes.io/component' label and maps it to the 'app.label.component' attribute which will be added to the associated resources
            - tag_name: app.label.component
              key: app.kubernetes.io/component
              from: pod
          otel_annotations: true
        pod_association:
          - sources:
              # This rule associates all resources containing the 'k8s.pod.ip' attribute with the matching pods. If this attribute is not present in the resource, this rule will not be able to find the matching pod.
              - from: resource_attribute
                name: k8s.pod.ip
          - sources:
              # This rule associates all resources containing the 'k8s.pod.uid' attribute with the matching pods. If this attribute is not present in the resource, this rule will not be able to find the matching pod.
              - from: resource_attribute
                name: k8s.pod.uid
          - sources:
              # This rule will use the IP from the incoming connection from which the resource is received, and find the matching pod, based on the 'pod.status.podIP' of the observed pods
              - from: connection
      logdedup:
        interval: 60s
        log_count_attribute: dedup_count
        timezone: "America/Los_Angeles"
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 15
    exporters:
      debug: {}
      otlp_http:
        endpoint: http://gateway-collector-headless.observability.svc.cluster.local:4318
        retry_on_failure:
          max_elapsed_time: 0
        # Count the queue in records, not requests (the receiver submits
        # small groups). On disk, so it is sized for an outage, not memory.
        sending_queue:
          storage: file_storage
          sizer: items
          queue_size: 200000
          batch: {}
    service:
      extensions:
        - file_storage
      pipelines:
        logs:
          receivers:
            - filelog
          processors:
            - memory_limiter
            - k8s_attributes
            - logdedup
          exporters:
            - otlp_http
      telemetry:
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/opentelemetry.io/opentelemetrycollector_v1beta1.json
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: gateway
spec:
  mode: statefulset
  replicas: 2
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/component: opentelemetry-collector
          app.kubernetes.io/instance: observability.gateway
  resources:
    limits:
      memory: 512Mi
    requests:
      cpu: 10m
  volumeMounts:
    - mountPath: /var/lib/otelcol/storage
      name: storage
  volumeClaimTemplates:
    - metadata:
        name: storage
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
        storageClassName: ceph-block
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - "ALL"
    readOnlyRootFilesystem: true
  podSecurityContext:
    runAsNonRoot: true
    runAsGroup: 1000
    runAsUser: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
  config:
    extensions:
      file_storage:
        directory: /var/lib/otelcol/storage
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      logdedup:
        interval: 60s
        log_count_attribute: dedup_count
        timezone: "America/Los_Angeles"
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 15
    exporters:
      debug: {}
      # Batching happens inside the persistent queue so records are on disk
      # before they are batched; retries stop only when the queue is full.
      otlp_http/logs:
        logs_endpoint: http://victoria-logs.observability.svc.cluster.local:9428/insert/opentelemetry/v1/logs
        headers:
          VL-Stream-Fields: k8s.cluster.name,k8s.namespace.name,k8s.pod.name,k8s.container.name,service.name,service.namespace
        retry_on_failure:
          max_elapsed_time: 0
        sending_queue:
          storage: file_storage
          batch: {}
      otlp_http/metrics:
        metrics_endpoint: http://victoria-metrics.observability.svc.cluster.local:8428/opentelemetry/v1/metrics
        retry_on_failure:
          max_elapsed_time: 0
        sending_queue:
          storage: file_storage
          batch: {}
    service:
      extensions:
        - file_storage
      pipelines:
        logs:
          receivers:
            - otlp
          processors:
            - memory_limiter
            - logdedup
          exporters:
            - otlp_http/logs
        metrics:
          receivers:
            - otlp
          processors:
            - memory_limiter
          exporters:
            - otlp_http/metrics
      telemetry:
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/opentelemetry.io/opentelemetrycollector_v1beta1.json
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: unifi-syslog
spec:
  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: 10m
  config:
    receivers:
      syslog:
        udp:
          listen_address: "0.0.0.0:514"
        allow_skip_pri_header: true
        protocol: rfc3164
        location: "America/Los_Angeles"
        attributes:
          service.name: unifi
    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 15
    exporters:
      debug:
        verbosity: detailed
      otlp_http:
        endpoint: http://gateway-collector-headless.observability.svc.cluster.local:4318
        # Count the queue in records, not requests: request sizes vary with
        # the receiver's grouping, so a request cap bounds neither memory nor
        # retained records. In-memory, so sized under the memory limit.
        sending_queue:
          sizer: items
          queue_size: 50000
          batch: {}
    service:
      pipelines:
        logs:
          receivers:
            - syslog
          processors:
            - memory_limiter
          exporters:
            - otlp_http
      telemetry:
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
