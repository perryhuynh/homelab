              - 'set(log.attributes["source.name"], "Kasa HS220 (.157)") where log.attributes["source.address"] == "192.168.50.157"'
              - 'set(log.attributes["source.name"], "Brother printer") where log.attributes["source.address"] == "192.168.50.198"'
              - 'set(log.attributes["source.name"], "Ring Chime Pro") where log.attributes["source.address"] == "192.168.50.201"'
              - 'set(log.attributes["source.name"], "DE1Pro") where log.attributes["source.address"] == "192.168.50.222"'
              - 'set(log.attributes["source.name"], "myq") where log.attributes["source.address"] == "192.168.50.226"'
              - 'set(log.attributes["source.name"], "TV - Mom") where log.attributes["source.address"] == "192.168.50.231"'
              - 'set(log.attributes["source.name"], "Ring Doorbell") where log.attributes["source.address"] == "192.168.50.233"'
              - 'set(log.attributes["source.name"], "Tesla Wall Connector") where log.attributes["source.address"] == "192.168.50.241"'
              - 'set(log.attributes["destination.name"], "UDM Pro Max") where log.attributes["destination.address"] == "192.168.1.1"'
              - 'set(log.attributes["destination.name"], "PiKVM") where log.attributes["destination.address"] == "192.168.1.4"'
              - 'set(log.attributes["destination.name"], "TESmart KVM") where log.attributes["destination.address"] == "192.168.1.5"'
              - 'set(log.attributes["destination.name"], "APC Smart UPS") where log.attributes["destination.address"] == "192.168.1.6"'
