---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/opentelemetry.io/opentelemetrycollector_v1beta1.json
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: events
spec:
  # The previous pod must release its queue before the next writer starts.
  deploymentUpdateStrategy:
    type: Recreate
  volumes:
    - name: queue
      persistentVolumeClaim:
        claimName: events-log-queue
  volumeMounts:
    - name: queue
      mountPath: /var/lib/otelcol/queue
  podSecurityContext:
    fsGroup: 10001
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
  resources:
    limits:
      memory: 512Mi
    requests:
      cpu: 10m
  config:
    extensions:
      file_storage:
        directory: /var/lib/otelcol/queue
        fsync: true
    receivers:
      k8s_events:
        auth_type: serviceAccount
    processors:
      batch: {}
      groupbyattrs:
        keys:
          - k8s.event.reason
          - k8s.object.name
          - k8s.namespace.name
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 15
    exporters:
      otlp_http:
        sending_queue:
          storage: file_storage
          sizer: bytes
          queue_size: 134217728 # 128 MiB of log payload, leaving room for database overhead
        retry_on_failure:
          enabled: true
          max_elapsed_time: 0
        logs_endpoint: http://victoria-logs.observability.svc.cluster.local:9428/insert/opentelemetry/v1/logs
        headers:
          VL-Stream-Fields: k8s.namespace.name,k8s.event.reason
    service:
      extensions: [file_storage]
      pipelines:
        logs:
          receivers:
            - k8s_events
          processors:
            - memory_limiter
            - groupbyattrs
            - batch
          exporters:
            - otlp_http
      telemetry:
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/opentelemetry.io/opentelemetrycollector_v1beta1.json
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: unifi-syslog
spec:
  # The previous pod must release its queue before the next writer starts.
  deploymentUpdateStrategy:
    type: Recreate
  volumes:
    - name: queue
      persistentVolumeClaim:
        claimName: unifi-syslog-log-queue
  volumeMounts:
    - name: queue
      mountPath: /var/lib/otelcol/queue
  podSecurityContext:
    fsGroup: 10001
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
  replicas: 1
  ports:
    - name: syslog
      port: 5514
      protocol: UDP
  resources:
    limits:
      memory: 512Mi
    requests:
      cpu: 10m
  config:
    extensions:
      file_storage:
        directory: /var/lib/otelcol/queue
        fsync: true
    receivers:
      syslog:
        protocol: rfc3164
        location: America/Los_Angeles
        # UniFi sends some CEF events without the <PRI> header.
        allow_skip_pri_header: true
        udp:
          listen_address: 0.0.0.0:5514
          one_log_per_packet: true
    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 15
      # UDM housekeeping that repeats thousands of times a day and is never useful.
      filter/noise:
        error_mode: ignore
        logs:
          log_record:
            - 'IsMatch(log.body, "earlyoom\\[|udapi_lu_set_inform_interval|config-migrate-helper|systemd-timedated|org\\.freedesktop\\.timedate1|\\[Statistic\\] Version=|Background sync: Fetching|stime is unknown")'
      transform/classify:
        error_mode: silent
        log_statements:
          - statements:
              - 'set(log.attributes["log.type"], "system")'
              - 'set(log.attributes["log.type"], "event") where IsMatch(log.body, "CEF:\\d+\\|")'
              - 'set(log.attributes["log.type"], "firewall") where IsMatch(log.body, "\\] DESCR=\"")'
              - 'set(log.attributes["log.type"], "dns") where IsMatch(log.body, "\"type\":\"dns")'
      # UniFi events (CEF): header into cef.*, extensions into unifi.* / cef.*, msg into the body.
      transform/event:
        error_mode: ignore
        log_statements:
          - conditions:
              - 'log.attributes["log.type"] == "event"'
            statements:
              - 'merge_maps(log.cache, ExtractPatterns(log.body, "CEF:\\d+\\|[^|]*\\|[^|]*\\|[^|]*\\|(?P<class_id>[^|]*)\\|(?P<name>[^|]*)\\|(?P<severity>[^|]*)\\|(?P<ext>.*)$"), "upsert")'
              - 'set(log.attributes["cef.name"], log.cache["name"])'
              - 'set(log.attributes["cef.class_id"], log.cache["class_id"])'
              - 'set(log.attributes["cef.severity"], log.cache["severity"])'
              # Mark each " key=" boundary; escaped "\=" inside values never matches.
              - 'replace_pattern(log.cache["ext"], " ([A-Za-z0-9_]+)=", "|~|$$1=")'
              - 'set(log.cache["kv"], ParseKeyValue(log.cache["ext"], "=", "|~|"))'
              - 'replace_all_patterns(log.cache["kv"], "value", "\\\\([=\\\\])", "$$1")'
              - 'replace_all_patterns(log.cache["kv"], "key", "^([a-z][A-Za-z0-9]*)$", "cef.$$1")'
              - 'replace_all_patterns(log.cache["kv"], "key", "^UNIFI", "unifi.")'
              - 'set(log.body, log.cache["kv"]["cef.msg"]) where log.cache["kv"]["cef.msg"] != nil'
              - 'delete_key(log.cache["kv"], "cef.msg")'
              - 'merge_maps(log.attributes, log.cache["kv"], "upsert")'
              - 'set(log.attributes["log.parse_failed"], true) where log.cache["name"] == nil'
      # Per-policy firewall logging: [LAN_WAN-D-10000] DESCR="rule" IN= OUT= ... SRC= DST= ... PROTO= SPT= DPT=
      transform/firewall:
        error_mode: ignore
        log_statements:
          - conditions:
              - 'log.attributes["log.type"] == "firewall"'
            statements:
              - 'merge_maps(log.cache, ExtractPatterns(log.body, "\\[(?P<chain>[^\\]]+)\\] DESCR=\"(?P<rule>[^\"]*)\" IN=(?P<in>\\S*) OUT=(?P<out>\\S*) .*?SRC=(?P<src>\\S+) DST=(?P<dst>\\S+) .*?PROTO=(?P<proto>\\S+)(?: SPT=(?P<spt>\\d+) DPT=(?P<dpt>\\d+))?"), "upsert")'
              - 'set(log.attributes["firewall.rule"], log.cache["rule"])'
              - 'set(log.attributes["firewall.chain"], log.cache["chain"])'
              - 'set(log.attributes["firewall.action"], "block") where IsMatch(log.cache["chain"], "-D-")'
              - 'set(log.attributes["firewall.action"], "allow") where IsMatch(log.cache["chain"], "-A-")'
              - 'set(log.attributes["firewall.action"], "reject") where IsMatch(log.cache["chain"], "-R-")'
              - 'set(log.attributes["firewall.in"], log.cache["in"])'
              - 'set(log.attributes["firewall.out"], log.cache["out"])'
              - 'set(log.attributes["source.address"], log.cache["src"])'
              - 'set(log.attributes["destination.address"], log.cache["dst"])'
              - 'set(log.attributes["network.transport"], ConvertCase(log.cache["proto"], "lower"))'
              - 'set(log.attributes["source.port"], log.cache["spt"]) where log.cache["spt"] != ""'
              - 'set(log.attributes["destination.port"], log.cache["dpt"]) where log.cache["dpt"] != ""'
              - 'set(log.body, Format("%s: %s %s %s:%s -> %s:%s", [log.cache["rule"], log.attributes["firewall.action"], log.attributes["network.transport"], log.cache["src"], log.cache["spt"], log.cache["dst"], log.cache["dpt"]]))'
              - 'set(log.attributes["log.parse_failed"], true) where log.cache["rule"] == nil'
      # UDM DNS ad-block hits: coredns[pid]: {"type":"dnsAdBlock","category":...,"domain":...,"mac":...}
      transform/dns:
        error_mode: ignore
        log_statements:
          - conditions:
              - 'log.attributes["log.type"] == "dns"'
            statements:
              - 'merge_maps(log.cache, ExtractPatterns(log.body, "coredns\\[\\d+\\]: (?P<json>\\{.*\\})"), "upsert")'
              - 'set(log.cache["dns"], ParseJSON(log.cache["json"]))'
              - 'set(log.attributes["dns.type"], log.cache["dns"]["type"])'
              - 'set(log.attributes["dns.category"], log.cache["dns"]["category"])'
              - 'set(log.attributes["dns.question.name"], log.cache["dns"]["domain"])'
              - 'set(log.attributes["client.address"], log.cache["dns"]["src_ip"])'
              - 'set(log.attributes["client.mac"], log.cache["dns"]["mac"])'
              - 'set(log.body, Format("%s %s: %s from %s", [log.cache["dns"]["type"], log.cache["dns"]["category"], log.cache["dns"]["domain"], log.cache["dns"]["src_ip"]]))'
              - 'set(log.attributes["log.parse_failed"], true) where log.cache["dns"] == nil'
      transform/system:
        error_mode: silent
        log_statements:
          - conditions:
              - 'log.attributes["log.type"] == "system"'
            statements:
              - 'set(log.body, log.attributes["message"]) where log.attributes["message"] != nil'
              # Switches and PDUs send appname "<mac>,<model>-<version>" and the message
              # starts with ": prog[pid]: ...".
              - 'merge_maps(log.cache, ExtractPatterns(log.attributes["appname"], "^[0-9a-f]{12},(?P<model>.+?)-(?P<version>\\d+\\.\\d+\\.\\d+\\S*)$"), "upsert") where log.attributes["appname"] != nil'
              - 'set(log.attributes["unifi.device.model"], log.cache["model"]) where log.cache["model"] != nil'
              - 'set(log.attributes["unifi.device.version"], log.cache["version"]) where log.cache["version"] != nil'
              - 'delete_key(log.attributes, "appname") where log.cache["model"] != nil'
              - 'replace_pattern(log.body, "^:\\s+", "")'
              # The UDM repeats its hostname before the program: "UDM-Pro-Max /usr/bin/prog[pid]: ..."
              - 'replace_pattern(log.body, "^[A-Za-z0-9._-]+ ((?:\\S*/)?[A-Za-z0-9_.-]+(?:\\[\\d+\\])?: )", "$$1")'
              - 'merge_maps(log.cache, ExtractPatterns(log.body, "^(?:\\S*/)?(?P<program>[A-Za-z0-9_.-]+)(?:\\[\\d+\\])?: "), "upsert")'
              - 'set(log.attributes["process.executable.name"], log.cache["program"]) where log.cache["program"] != nil'
      transform/cleanup:
        error_mode: silent
        log_statements:
          - statements:
              - 'delete_key(log.attributes, "message")'
              - 'delete_key(log.attributes, "appname") where log.attributes["appname"] == log.attributes["hostname"]'
              - 'delete_key(log.attributes, "priority")'
              - 'delete_key(log.attributes, "facility")'
      resource:
        attributes:
          - key: service.name
            value: unifi
            action: upsert
      batch: {}
    exporters:
      otlp_http:
        sending_queue:
          storage: file_storage
          sizer: bytes
          queue_size: 134217728 # 128 MiB of log payload, leaving room for database overhead
        retry_on_failure:
          enabled: true
          max_elapsed_time: 0
        logs_endpoint: http://victoria-logs.observability.svc.cluster.local:9428/insert/opentelemetry/v1/logs
        headers:
          VL-Stream-Fields: service.name,hostname,log.type
          VL-Ignore-Fields: scope.name,scope.version
    service:
      extensions: [file_storage]
      pipelines:
        logs:
          receivers:
            - syslog
          processors:
            - memory_limiter
            - filter/noise
            - transform/classify
            - transform/event
            - transform/firewall
            - transform/dns
            - transform/system
            - transform/cleanup
            - resource
            - batch
          exporters:
            - otlp_http
      telemetry:
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/opentelemetry.io/opentelemetrycollector_v1beta1.json
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: truenas-syslog
spec:
  # The previous pod must release its queue before the next writer starts.
  deploymentUpdateStrategy:
    type: Recreate
  volumes:
    - name: queue
      persistentVolumeClaim:
        claimName: truenas-syslog-log-queue
  volumeMounts:
    - name: queue
      mountPath: /var/lib/otelcol/queue
  podSecurityContext:
    fsGroup: 10001
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
  replicas: 1
  ports:
    - name: syslog
      port: 5514
      protocol: TCP
  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: 10m
  config:
    extensions:
      file_storage:
        directory: /var/lib/otelcol/queue
        fsync: true
    receivers:
      # TrueNAS uses syslog-ng's syslog() driver: RFC 5424 with octet-counting
      # framing over TCP.
      syslog:
        protocol: rfc5424
        enable_octet_counting: true
        tcp:
          listen_address: 0.0.0.0:5514
          # TrueNAS's template ends each message with "\n" and counts it in the
          # octet length; trimming it makes every frame one byte short.
          preserve_trailing_whitespaces: true
    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 15
      transform/message:
        error_mode: ignore
        log_statements:
          - statements:
              - 'set(log.body, log.attributes["message"]) where log.attributes["message"] != nil'
              - 'replace_pattern(log.body, "\\s+$", "")'
              - 'set(log.attributes["process.executable.name"], log.attributes["appname"]) where log.attributes["appname"] != nil'
              - 'delete_key(log.attributes, "message")'
              - 'delete_key(log.attributes, "appname")'
              - 'delete_key(log.attributes, "priority")'
              - 'delete_key(log.attributes, "facility")'
              - 'delete_key(log.attributes, "version")'
      # Audit events (middleware, SMB, sudo) arrive as "@cee:{"TNAUDIT": {...}}".
      # svc_data and event_data are JSON documents encoded as strings.
      transform/audit:
        error_mode: ignore
        log_statements:
          - conditions:
              - 'IsMatch(log.body, "^@cee:\\{")'
            statements:
              - 'set(log.cache["a"], ParseJSON(Substring(log.body, 5, Len(log.body) - 5))["TNAUDIT"])'
              - 'set(log.attributes["log.parse_failed"], true) where log.cache["a"] == nil'
              - 'set(log.cache["ed"], ParseJSON(log.cache["a"]["event_data"])) where log.cache["a"] != nil and IsString(log.cache["a"]["event_data"]) and log.cache["a"]["event_data"] != "null"'
              - 'set(log.cache["sd"], ParseJSON(log.cache["a"]["svc_data"])) where log.cache["a"] != nil and IsString(log.cache["a"]["svc_data"]) and log.cache["a"]["svc_data"] != "null"'
              - 'set(log.attributes["truenas.audit.raw"], log.body) where log.cache["a"] != nil'
              - 'set(log.attributes["truenas.audit.event"], log.cache["a"]["event"]) where log.cache["a"] != nil'
              - 'set(log.attributes["truenas.audit.service"], log.cache["a"]["svc"]) where log.cache["a"] != nil'
              - 'set(log.attributes["truenas.audit.success"], log.cache["a"]["success"]) where log.cache["a"] != nil'
              - 'set(log.attributes["truenas.audit.session"], log.cache["a"]["sess"]) where log.cache["a"] != nil'
              - 'set(log.attributes["user.name"], log.cache["a"]["user"]) where log.cache["a"] != nil'
              - 'set(log.attributes["client.address"], log.cache["a"]["addr"]) where log.cache["a"] != nil'
              - 'set(log.attributes["truenas.audit.method"], log.cache["ed"]["method"]) where log.cache["ed"] != nil and log.cache["ed"]["method"] != nil'
              - 'set(log.attributes["truenas.audit.description"], log.cache["ed"]["description"]) where log.cache["ed"] != nil and log.cache["ed"]["description"] != nil'
              - 'set(log.attributes["truenas.audit.error"], log.cache["ed"]["error"]) where log.cache["ed"] != nil and log.cache["ed"]["error"] != nil'
              - 'set(log.attributes["truenas.audit.credentials"], log.cache["sd"]["credentials"]["credentials"]) where log.cache["sd"] != nil and log.cache["sd"]["credentials"] != nil'
              - 'set(log.attributes["truenas.audit.protocol"], log.cache["sd"]["protocol"]) where log.cache["sd"] != nil and log.cache["sd"]["protocol"] != nil'
              # "METHOD_CALL system.advanced.update by root from 192.168.1.23 (ok)"
              - 'set(log.body, Format("%s by %s from %s", [log.cache["a"]["event"], log.cache["a"]["user"], log.cache["a"]["addr"]])) where log.cache["a"] != nil'
              - 'set(log.body, Format("%s %s by %s from %s", [log.cache["a"]["event"], log.cache["ed"]["method"], log.cache["a"]["user"], log.cache["a"]["addr"]])) where log.cache["ed"] != nil and log.cache["ed"]["method"] != nil'
              - 'set(log.body, Concat([log.body, "(ok)"], " ")) where log.cache["a"] != nil and log.cache["a"]["success"] == true'
              - 'set(log.body, Concat([log.body, "(failed)"], " ")) where log.cache["a"] != nil and log.cache["a"]["success"] == false'
      resource:
        attributes:
          - key: service.name
            value: truenas
            action: upsert
      batch: {}
    exporters:
      otlp_http:
        sending_queue:
          storage: file_storage
          sizer: bytes
          queue_size: 134217728 # 128 MiB of log payload, leaving room for database overhead
        retry_on_failure:
          enabled: true
          max_elapsed_time: 0
        logs_endpoint: http://victoria-logs.observability.svc.cluster.local:9428/insert/opentelemetry/v1/logs
        headers:
          VL-Stream-Fields: service.name,hostname,process.executable.name
          VL-Ignore-Fields: scope.name,scope.version
    service:
      extensions: [file_storage]
      pipelines:
        logs:
          receivers:
            - syslog
          processors:
            - memory_limiter
            - transform/message
            - transform/audit
            - resource
            - batch
          exporters:
            - otlp_http
      telemetry:
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/opentelemetry.io/opentelemetrycollector_v1beta1.json
# Receives Talos service and kernel logs (talos/patches/all/15-logging.yaml) on
# each node and ships them to VictoriaLogs. Talos sends to the pinned ClusterIP
# of the talos-logs Service (service.yaml), which routes to the local pod.
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: talos-logs
spec:
  mode: daemonset
  podSecurityContext:
    fsGroup: 10001
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
  ports:
    - name: talos
      port: 6050
      protocol: TCP
  env:
    - name: NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: 10m
      memory: 64Mi
  volumes:
    - name: queue
      emptyDir:
        medium: Memory
        sizeLimit: 32Mi
  volumeMounts:
    - name: queue
      mountPath: /var/lib/otelcol/queue
  config:
    extensions:
      file_storage:
        directory: /var/lib/otelcol/queue
    receivers:
      # Talos sends one JSON object per line. Service lines carry msg (syslogd
      # uses content), talos-level, talos-service and talos-time; kernel lines
      # from KmsgLogConfig carry facility instead of talos-service.
      tcp_log:
        listen_address: 0.0.0.0:6050
        # Talos cannot resend lines it already handed over. Retry when the
        # memory limiter refuses them under pressure.
        retry_on_failure:
          enabled: true
          max_elapsed_time: 0
        operators:
          - type: json_parser
            parse_from: body
            parse_to: attributes
            timestamp:
              parse_from: attributes["talos-time"]
              layout_type: gotime
              layout: "2006-01-02T15:04:05.999999999Z07:00"
    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 15
      # The "kernel" service duplicates the lines that KmsgLogConfig sends.
      # dns-resolve-cache is two debug lines per host DNS query. The console
      # dashboard polls machined every second.
      filter/noise:
        error_mode: ignore
        logs:
          log_record:
            - 'IsMatch(log.attributes["talos-service"], "^(kernel|dns-resolve-cache)$$")'
            - 'log.attributes["talos-service"] == "machined" and IsMatch(log.attributes["msg"], "match with service \"dashboard\"")'
      # Keep the field names the Fluent Bit relay wrote: the message in the
      # body, level, and node.
      transform/talos:
        error_mode: ignore
        log_statements:
          - statements:
              - 'set(log.body, log.attributes["msg"]) where log.attributes["msg"] != nil'
              - 'set(log.body, log.attributes["content"]) where log.attributes["msg"] == nil and log.attributes["content"] != nil'
              # Kernel lines end in a newline.
              - 'replace_pattern(log.body, "\\n$$", "")'
              - 'set(log.attributes["level"], log.attributes["talos-level"]) where log.attributes["talos-level"] != nil'
              - 'set(log.attributes["node"], "${env:NODE_NAME}")'
              # json_parser reads numbers as floats; keep kernel counters whole.
              - 'set(log.attributes["clock"], Int(log.attributes["clock"])) where log.attributes["clock"] != nil'
              - 'set(log.attributes["seq"], Int(log.attributes["seq"])) where log.attributes["seq"] != nil'
              - 'delete_matching_keys(log.attributes, "^(msg|content|talos-level|talos-time)$$")'
      batch: {}
    exporters:
      otlp_http:
        logs_endpoint: http://victoria-logs.observability.svc.cluster.local:9428/insert/opentelemetry/v1/logs
        headers:
          VL-Stream-Fields: node,talos-service,facility
          VL-Ignore-Fields: scope.name,scope.version
        sending_queue:
          storage: file_storage
          sizer: bytes
          queue_size: 4194304
        retry_on_failure:
          enabled: true
          max_elapsed_time: 0
    service:
      extensions: [file_storage]
      pipelines:
        logs:
          receivers:
            - tcp_log
          processors:
            - memory_limiter
            - filter/noise
            - transform/talos
            - batch
          exporters:
            - otlp_http
      telemetry:
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/opentelemetry.io/opentelemetrycollector_v1beta1.json
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: filelog
spec:
  mode: daemonset
  tolerations:
    - operator: Exists
  podAnnotations:
    kubernetes.io/egress-bandwidth: 4M
  podSecurityContext:
    fsGroup: 10001
    runAsNonRoot: true
    runAsUser: 10001
    # Read kubelet's root-group log files through the read-only mount.
    runAsGroup: 0
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]
  resources:
    requests:
      cpu: 10m
      memory: 1Gi
    limits:
      memory: 1Gi
  env:
    - name: KUBE_NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
  volumes:
    - name: queue
      emptyDir:
        medium: Memory
        sizeLimit: 32Mi
    - name: pod-logs
      hostPath:
        path: /var/log/pods
        type: Directory
  volumeMounts:
    - name: queue
      mountPath: /var/lib/otelcol/queue
    - name: pod-logs
      mountPath: /var/log/pods
      readOnly: true
  config:
    extensions:
      file_storage:
        directory: /var/lib/otelcol/queue
    receivers:
      filelog:
        include: [/var/log/pods/*/*/*.log]
        start_at: end
        include_file_path: true
        operators:
          - type: container
    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 15
      k8s_attributes:
        filter:
          node_from_env_var: KUBE_NODE_NAME
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid
        extract:
          metadata: [k8s.pod.ip, k8s.node.name, container.id]
          labels:
            - from: pod
              key_regex: (.+)
              tag_name: kubernetes.pod_labels.$$1
      resource:
        attributes:
          - {key: kubernetes.pod_name, from_attribute: k8s.pod.name, action: upsert}
          - {key: kubernetes.pod_namespace, from_attribute: k8s.namespace.name, action: upsert}
          - {key: kubernetes.container_name, from_attribute: k8s.container.name, action: upsert}
          - {key: kubernetes.pod_node_name, from_attribute: k8s.node.name, action: upsert}
          - {key: kubernetes.pod_ip, from_attribute: k8s.pod.ip, action: upsert}
          - {key: kubernetes.container_id, from_attribute: container.id, action: upsert}
      transform/message:
        error_mode: silent
        log_statements:
          - statements:
              - 'set(log.attributes["output_stream"], log.attributes["log.iostream"])'
              - 'merge_maps(log.cache, ParseJSON(log.body), "upsert") where IsMatch(log.body, "^\\s*\\{")'
              - 'merge_maps(log.attributes, log.cache, "upsert")'
              # Prefer application time when present; otherwise keep the CRI timestamp.
              - 'set(log.cache["app_time"], log.cache["timestamp"])'
              - 'set(log.cache["app_time"], log.cache["ts"]) where log.cache["ts"] != nil'
              - 'set(log.cache["app_time"], log.cache["time"]) where log.cache["time"] != nil'
              - 'set(log.time, Time(log.cache["app_time"], "%Y-%m-%dT%H:%M:%SZ")) where IsString(log.cache["app_time"]) and IsMatch(log.cache["app_time"], "Z$$")'
              - 'set(log.time, Time(log.cache["app_time"], "%Y-%m-%dT%H:%M:%S%j")) where IsString(log.cache["app_time"]) and not IsMatch(log.cache["app_time"], "Z$$")'
              - 'set(log.time_unix_nano, Int(Double(log.cache["app_time"]) * 1000000000.0)) where (IsDouble(log.cache["app_time"]) or IsInt(log.cache["app_time"])) and log.cache["app_time"] > 0 and log.cache["app_time"] < 10000000000'
              - 'set(log.body, log.cache["log"]) where IsString(log.cache["log"])'
              - 'set(log.body, log.cache["msg"]) where IsString(log.cache["msg"])'
              - 'set(log.body, log.cache["message"]) where IsString(log.cache["message"])'
              - 'replace_pattern(log.body, "\\x1b\\[[0-9;]*m", "")'
      batch:
        send_batch_size: 256
        send_batch_max_size: 256
    exporters:
      otlp_http:
        logs_endpoint: http://victoria-logs.observability.svc.cluster.local:9428/insert/opentelemetry/v1/logs
        headers:
          VL-Stream-Fields: kubernetes.pod_namespace,kubernetes.pod_name,kubernetes.container_name,kubernetes.pod_labels.app.kubernetes.io/name
        # Prefer a short gap to flooding VictoriaLogs with a node's backlog.
        sending_queue:
          storage: file_storage
          sizer: bytes
          queue_size: 4194304
          num_consumers: 1
        retry_on_failure:
          max_elapsed_time: 30s
    service:
      extensions: [file_storage]
      pipelines:
        logs:
          receivers: [filelog]
          processors: [memory_limiter, k8s_attributes, resource, transform/message, batch]
          exporters: [otlp_http]
      telemetry:
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
