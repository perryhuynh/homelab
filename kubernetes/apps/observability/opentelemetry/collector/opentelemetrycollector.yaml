        error_mode: ignore
        log_statements:
          - statements:
              - 'set(log.cache["src"], log.attributes["source.address"])'
              - 'set(log.cache["src"], log.attributes["source.name"]) where log.attributes["source.name"] != nil'
              - 'set(log.cache["dst"], log.attributes["destination.address"])'
              - 'set(log.cache["dst"], log.attributes["destination.name"]) where log.attributes["destination.name"] != nil'
              - 'set(log.body, Format("%v %v:%v -> %v:%v", [log.attributes["network.transport"], log.cache["src"], log.attributes["source.port"], log.cache["dst"], log.attributes["destination.port"]]))'
      resource:
        attributes:
          - key: service.name
            value: unifi-netflow
            action: upsert
      batch: {}
    exporters:
      otlp_http:
        logs_endpoint: http://victoria-logs.observability.svc.cluster.local:9428/insert/opentelemetry/v1/logs
        headers:
          VL-Stream-Fields: service.name,flow.sampler_address
          VL-Ignore-Fields: scope.name,scope.version
    service:
      pipelines:
        logs:
          receivers:
            - netflow
          processors:
            - memory_limiter
            - filter/cluster
            - transform/names
            - transform/message
            - resource
            - batch
          exporters:
            - otlp_http
      telemetry:
        metrics:
          readers:
            - periodic:
                exporter:
                  otlp:
                    protocol: http/protobuf
                    endpoint: http://victoria-metrics.observability.svc.cluster.local:8428/opentelemetry/v1/metrics
