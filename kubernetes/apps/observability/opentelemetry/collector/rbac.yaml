---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: events-collector
rules:
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: events-collector
subjects:
  - kind: ServiceAccount
    name: events-collector
    namespace: observability
roleRef:
  kind: ClusterRole
  name: events-collector
  apiGroup: rbac.authorization.k8s.io
