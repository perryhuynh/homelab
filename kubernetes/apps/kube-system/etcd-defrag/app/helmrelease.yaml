---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: etcd-defrag
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: etcd-defrag
  values:
    defaultPodOptions:
      # Must use host network to access etcd on localhost:2379
      hostNetwork: true
      securityContext:
        # Talos owns the etcd credentials as 60:60 with mode 0400.
        runAsUser: 60
        runAsGroup: 60
        runAsNonRoot: true
      # Ensure this only runs on the control plane node
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
    controllers:
      etcd-defrag:
        type: cronjob
        cronjob:
          # Run weekly on Sunday at 3 AM
          schedule: "0 3 * * 0"
          concurrencyPolicy: Forbid
          failedJobsHistory: 1
          successfulJobsHistory: 0
          timeZone: "America/Los_Angeles"
        containers:
          app:
            image:
              repository: ghcr.io/ahrtr/etcd-defrag
              tag: v0.48.0@sha256:0aa0248ef4e261f25e787327051ea103c8608ddb6f4ec3b732f0fd55abf5cb1b
            args:
              - --endpoints=https://127.0.0.1:2379
              - --cluster
              - --cacert=/certs/ca.crt
              - --cert=/certs/server.crt
              - --key=/certs/server.key
              # Defrag when DB quota usage > 50% OR free space > 100MB
              - --defrag-rule=dbQuotaUsage > 0.5 || dbSizeFree > 100*1024*1024
              # Move leader during defrag (safe for single-node)
              - --move-leader
              # Wait 30s between defrags (only matters if you had multiple members)
              - --wait-between-defrags=30s
              # Auto-disalarm space quota alarms
              - --auto-disalarm
              - --disalarm-threshold=0.8
            resources:
              limits:
                memory: 128Mi
              requests:
                cpu: 10m
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
    persistence:
      ca-crt:
        type: hostPath
        hostPath: /system/secrets/etcd/ca.crt
        globalMounts:
          - path: /certs/ca.crt
            readOnly: true
      server-crt:
        type: hostPath
        hostPath: /system/secrets/etcd/server.crt
        globalMounts:
          - path: /certs/server.crt
            readOnly: true
      server-key:
        type: hostPath
        hostPath: /system/secrets/etcd/server.key
        globalMounts:
          - path: /certs/server.key
            readOnly: true
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
            subPath: tmp
