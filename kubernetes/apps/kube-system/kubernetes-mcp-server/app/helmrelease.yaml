---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app kubernetes-mcp-server
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: *app
  values:
    image:
      registry: quay.io
      repository: containers/kubernetes_mcp_server
      # renovate: datasource=docker depName=quay.io/containers/kubernetes_mcp_server
      version: v0.1.2@sha256:c289505b06079d7f265a6fef977ce1abbfbbb4271772db17db5b58edbf44c255
    config:
      read_only: true
    ingress:
      enabled: false
    rbac:
      extraClusterRoleBindings:
        - name: view
          roleRef:
            name: view
            external: true
    resources:
      limits:
        memory: 256Mi
      requests:
        cpu: 10m
