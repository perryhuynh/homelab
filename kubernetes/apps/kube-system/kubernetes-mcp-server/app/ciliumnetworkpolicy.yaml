---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kubernetes-mcp-server
spec:
  description: Only the agentgateway mcp proxy may reach kubernetes-mcp-server
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: kubernetes-mcp-server
  ingress:
    # Kubelet probes.
    - fromEntities:
        - host
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: networking
            gateway.networking.k8s.io/gateway-name: mcp
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
