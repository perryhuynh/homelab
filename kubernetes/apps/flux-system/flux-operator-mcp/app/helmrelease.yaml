---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-operator-mcp
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: flux-operator-mcp
  values:
    transport: http
    readonly: true
    # replaced by ./ciliumnetworkpolicy.yaml, which admits only the agentgateway proxy pod
    # instead of every pod in the networking and flux-system namespaces
    networkPolicy:
      create: false
