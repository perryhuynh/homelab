---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: notification-controller
spec:
  endpointSelector:
    matchLabels:
      app: notification-controller
  ingress:
    # Kubelet probes.
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "9440"
              protocol: TCP
    # The public GitHub webhook (httproute.yaml) on the receiver port.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: networking
            gateway.envoyproxy.io/owning-gateway-name: envoy-external
      toPorts:
        - ports:
            - port: "9292"
              protocol: TCP
    # Events from the controllers started with --events-addr.
    - fromEndpoints:
        - matchExpressions:
            - key: app
              operator: In
              values: ["helm-controller", "kustomize-controller", "source-controller"]
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
    # Metrics (podmonitor.yaml).
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: prometheus
            app.kubernetes.io/instance: kube-prometheus-stack
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    # Watching Alerts, Providers and Receivers, and annotating the resources a
    # Receiver triggers.
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
    # Every Provider is type alertmanager.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: alertmanager
            app.kubernetes.io/instance: kube-prometheus-stack
      toPorts:
        - ports:
            - port: "9093"
              protocol: TCP
