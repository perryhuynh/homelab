---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: konflate
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: konflate
  ingress:
    # Kubelet probes.
    - fromEntities:
        - host
    - fromEndpoints:
        # The public route and the agentgateway mcp proxy both use the HTTP port.
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: networking
            gateway.envoyproxy.io/owning-gateway-name: envoy-external
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: networking
            gateway.networking.k8s.io/gateway-name: mcp
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: prometheus
            app.kubernetes.io/instance: kube-prometheus-stack
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
    # Replies to this pod's own outbound connections. Cilium denies replies from
    # same-node peers under an ingress policy, so allow the ephemeral port range.
    # Peers still cannot open new connections to the listening ports.
    - fromEntities:
        - cluster
      toPorts:
        - ports:
            - port: "32768"
              endPort: 60999
              protocol: TCP
            - port: "32768"
              endPort: 60999
              protocol: UDP
