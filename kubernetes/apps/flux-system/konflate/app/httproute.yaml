---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: konflate-webhook
spec:
  hostnames: ["konflate-webhook.perryhuynh.com"]
  parentRefs:
    - name: envoy-external
      namespace: networking
      sectionName: https
  rules:
    # Only GitHub's webhook is public, on its own hostname. The UI hostname has
    # no public DNS record, so DoH resolvers fall back to the internal record.
    - backendRefs:
        - name: konflate
          port: 8080
      matches:
        - method: POST
          path:
            type: Exact
            value: /hooks
