---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: paperless-tika
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: paperless-tika
  ingress:
    # Kubelet probes.
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "9998"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: paperless
      toPorts:
        - ports:
            - port: "9998"
              protocol: TCP
  # Tika parses untrusted documents, and needs no network of its own. Denying all egress keeps a
  # malicious document from reaching anything.
  egress:
    - {}
