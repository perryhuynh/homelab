---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tuppr
spec:
  interval: 1h
  chart:
    kind: OCIRepository
    spec:
      interval: 15m
      ref:
        tag: 0.5.14
      url: oci://ghcr.io/home-operations/charts/tuppr
      verify:
        provider: cosign
        matchOIDCIdentity:
          - issuer: "^https://token.actions.githubusercontent.com$"
            subject: "^https://github.com/home-operations/tuppr.*$"
  values:
    replicaCount: 2
    monitoring:
      serviceMonitor:
        enabled: true
