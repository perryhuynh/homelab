---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/referencegrant_v1beta1.json
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: agentgateway-jwks
spec:
  # agentgateway fetches Authelia's JWKS in-cluster to validate MCP access tokens
  from:
    - group: agentgateway.dev
      kind: AgentgatewayPolicy
      namespace: networking
  to:
    - group: ""
      kind: Service
      name: authelia
