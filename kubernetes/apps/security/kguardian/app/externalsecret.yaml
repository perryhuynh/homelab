---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kguardian-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    deletionPolicy: Delete
    template:
      engineVersion: v2
      data:
        # broker DATABASE_URL password (user and database name are chart values)
        KGUARDIAN_POSTGRES_PASS: &dbPass "{{ .kguardian_postgres_pass }}"
        INIT_POSTGRES_DBNAME: kguardian
        INIT_POSTGRES_HOST: postgres-rw.database.svc.cluster.local
        INIT_POSTGRES_USER: kguardian
        INIT_POSTGRES_PASS: *dbPass
        INIT_POSTGRES_SUPER_PASS: "{{ .cnpg_postgres_super_pass }}"
  dataFrom:
    - extract:
        key: kguardian
      rewrite:
        - regexp:
            source: "(.*)"
            target: "kguardian_$1"
    - extract:
        key: cloudnative-pg
      rewrite:
        - regexp:
            source: "(.*)"
            target: "cnpg_$1"
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kguardian-broker-auth
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    deletionPolicy: Delete
    template:
      engineVersion: v2
      data:
        # scoped broker API tokens: read (frontend, CLI), ingest (controller)
        read: "{{ .broker_read_token }}"
        ingest: "{{ .broker_ingest_token }}"
  dataFrom:
    - extract:
        key: kguardian
