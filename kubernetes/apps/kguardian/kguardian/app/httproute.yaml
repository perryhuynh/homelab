---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kguardian
spec:
  hostnames: ["kguardian.perryhuynh.com"]
  parentRefs:
    - name: envoy-internal
      namespace: networking
      sectionName: https
  rules:
    # the UI proxies /api to the broker itself, adding the read token server-side
    - backendRefs:
        - name: kguardian-frontend
          port: 5173
