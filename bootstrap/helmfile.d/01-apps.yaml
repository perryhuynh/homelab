---
# yaml-language-server: $schema=https://json.schemastore.org/helmfile

helmDefaults:
  cleanupOnFail: true
  wait: true
  waitForJobs: true

bases:
  - ./templates/ocirepository.yaml

releases:
  - name: cilium
    namespace: kube-system
    atomic: true
    inherit:
      - template: ocirepository
    values:
      - ./templates/values.yaml.gotmpl
    hooks:
      - # Wait for Cilium CRDs to be available
        command: bash
        args:
          - -c
          - until kubectl get crd ciliumloadbalancerippools.cilium.io ciliuml2announcementpolicies.cilium.io ciliumbgpadvertisements.cilium.io ciliumbgppeerconfigs.cilium.io ciliumbgpclusterconfigs.cilium.io &>/dev/null; do sleep 5; done
        events:
          - postsync
        showlogs: true
      - command: kubectl
        args:
          - apply
          - --namespace=kube-system
          - --server-side
          - --field-manager=kustomize-controller
          - --kustomize
          - ../../kubernetes/apps/kube-system/cilium/networks/
        events:
          - postsync

  - name: coredns
    namespace: kube-system
    atomic: true
    inherit:
      - template: ocirepository
    values:
      - ./templates/values.yaml.gotmpl
    needs:
      - "kube-system/cilium"

  - name: spegel
    namespace: kube-system
    atomic: true
    inherit:
      - template: ocirepository
    values:
      - ./templates/values.yaml.gotmpl
    needs:
      - "kube-system/coredns"

  - name: cert-manager
    namespace: cert-manager
    atomic: true
    inherit:
      - template: ocirepository
    values:
      - ./templates/values.yaml.gotmpl
    needs:
      - "kube-system/spegel"

  - name: external-secrets
    namespace: external-secrets
    inherit:
      - template: ocirepository
    values:
      - ./templates/values.yaml.gotmpl
    hooks:
      - # Wait for ExternalSecrets CRDs to be available
        command: bash
        args:
          - -c
          - until kubectl get crd clustersecretstores.external-secrets.io &>/dev/null; do sleep 5; done
        events:
          - postsync
        showlogs: true
    needs:
      - "cert-manager/cert-manager"

  - name: onepassword-connect
    namespace: external-secrets
    atomic: true
    inherit:
      - template: ocirepository
    values:
      - ./templates/values.yaml.gotmpl
    hooks:
      - command: kubectl
        args:
          - apply
          - --server-side
          - --field-manager=kustomize-controller
          - --filename=../../kubernetes/apps/external-secrets/onepassword-connect/app/clustersecretstore.yaml
        events:
          - postsync
        showlogs: true
    needs:
      - "external-secrets/external-secrets"

  - name: flux-operator
    namespace: flux-system
    atomic: true
    inherit:
      - template: ocirepository
    values:
      - ./templates/values.yaml.gotmpl
    needs:
      - "external-secrets/onepassword-connect"

  - name: flux-instance
    namespace: flux-system
    atomic: true
    inherit:
      - template: ocirepository
    values:
      - ./templates/values.yaml.gotmpl
    needs:
      - "flux-system/flux-operator"
