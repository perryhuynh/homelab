---
# yaml-language-server: $schema=https://json.schemastore.org/helmfile

# This helmfile is for extracting and installing Custom Resource Definitions (CRDs) from Helm charts.
# It is not intended to be used with helmfile apply or helmfile sync.

helmDefaults:
  args:
    - --include-crds
    - --no-hooks

bases:
  - ./templates/ocirepository.yaml

releases:
  - name: cloudflare-dns
    namespace: networking
    # Not under the <namespace>/<name>/app layout the ocirepository template expects
    chart: '{{ (fromYaml (readFile "../../kubernetes/apps/networking/external-dns/cloudflare/ocirepository.yaml")).spec.url }}'
    version: '{{ (fromYaml (readFile "../../kubernetes/apps/networking/external-dns/cloudflare/ocirepository.yaml")).spec.ref.tag }}'
    values:
      # external-dns >= 1.23 schema requires an explicit policy
      - policy: sync

  - name: envoy-gateway
    namespace: networking
    inherit:
      - template: ocirepository

  - name: grafana-operator
    namespace: observability
    inherit:
      - template: ocirepository

  - name: kube-prometheus-stack
    namespace: observability
    inherit:
      - template: ocirepository
