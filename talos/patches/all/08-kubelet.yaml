---
# Kubelet stays in v1alpha1: machine.kubelet.extraMounts (09-kubelet-extra-mounts.yaml)
# has no KubeletConfig equivalent, and the two forms are mutually exclusive.
apiVersion: v1alpha1
kind: KubeletConfig
$patch: delete
---
# Configure kubelet
machine:
  kubelet:
    defaultRuntimeSeccompProfileEnabled: true
    disableManifestsDirectory: true
    extraConfig:
      featureGates:
        ImageVolume: true
      # Start image GC before /var reaches 70% used, where Ceph raises MON_DISK_LOW
      # (mon_data_avail_warn: 30). Mon data shares /var via hostPath.
      imageGCHighThresholdPercent: 65
      imageGCLowThresholdPercent: 55
      maxPods: 150
      serializeImagePulls: false
---
apiVersion: v1alpha1
kind: KubeNodeConfig
nodeIP:
  validSubnets:
    - 192.168.1.0/24
