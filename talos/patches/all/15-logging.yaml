---
# Ship Talos service and kernel logs to the talos-logs OTel collector
# DaemonSet, which forwards them to VictoriaLogs. The host network namespace
# cannot resolve cluster DNS, so this is the pinned ClusterIP of the talos-logs
# Service (kubernetes/apps/observability/opentelemetry/collector/service.yaml).
machine:
  logging:
    destinations:
      - endpoint: tcp://10.43.0.61:6050/
        format: json_lines
---
apiVersion: v1alpha1
kind: KmsgLogConfig
name: talos-logs
url: tcp://10.43.0.61:6050/
