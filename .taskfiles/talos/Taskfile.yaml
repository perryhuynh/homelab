---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3'

tasks:

  apply:
    desc: Apply Talos config to all nodes [MODE=auto]
    dir: '{{.TALOS_DIR}}'
    cmd: topf apply --mode={{.MODE}}
    vars:
      MODE: '{{.MODE | default "auto"}}'
    preconditions:
      - test -f {{.TALOS_DIR}}/topf.yaml
      - test -f {{.SOPS_AGE_KEY_FILE}}
      - which topf

  apply-node:
    desc: Apply Talos config to a node [IP=required] [MODE=auto]
    dir: '{{.TALOS_DIR}}'
    cmd: topf apply --nodes-filter '^{{.HOST}}$' --mode={{.MODE}}
    vars:
      MODE: '{{.MODE | default "auto"}}'
      HOST:
        sh: yq --exit-status '.nodes[] | select(.ip == "{{.IP}}") | .host' {{.TALOS_DIR}}/topf.yaml
    requires:
      vars: [IP]
    preconditions:
      - test -f {{.TALOS_DIR}}/topf.yaml
      - test -f {{.SOPS_AGE_KEY_FILE}}
      - which topf yq

  diff:
    desc: Show the Talos config changes that would be applied
    dir: '{{.TALOS_DIR}}'
    cmd: topf apply --dry-run
    preconditions:
      - test -f {{.TALOS_DIR}}/topf.yaml
      - test -f {{.SOPS_AGE_KEY_FILE}}
      - which topf

  generate-config:
    desc: Render Talos machine configs without applying them
    dir: '{{.TALOS_DIR}}'
    cmd: topf render --output clusterconfig
    preconditions:
      - test -f {{.TALOS_DIR}}/topf.yaml
      - test -f {{.SOPS_AGE_KEY_FILE}}
      - which topf

  talosconfig:
    desc: Generate the Talos client config
    dir: '{{.TALOS_DIR}}'
    cmd: topf talosconfig > talosconfig
    preconditions:
      - test -f {{.TALOS_DIR}}/topf.yaml
      - test -f {{.SOPS_AGE_KEY_FILE}}
      - which topf

  reboot-node:
    desc: Reboot Talos on a single node [IP=required] [MODE=powercycle]
    cmd: talosctl --nodes {{.IP}} reboot --mode={{.MODE}}
    vars:
      MODE: '{{.MODE | default "powercycle"}}'
    requires:
      vars: [IP]
    preconditions:
      - talosctl --nodes {{.IP}} get machineconfig
      - which talosctl

  reset-cluster:
    desc: Resets nodes back to maintenance mode
    dir: '{{.TALOS_DIR}}'
    prompt: This will destroy your cluster and reset the nodes back to maintenance mode... continue?
    cmd: topf reset {{if eq .CLI_FORCE true}}--full{{end}} --wait-for-maintenance
    preconditions:
      - which topf

  reset-node:
    desc: Reset Talos on a single node [IP=required]
    dir: '{{.TALOS_DIR}}'
    prompt: Reset Talos node '{{.IP}}' ... continue?
    cmd: topf reset --nodes-filter '^{{.HOST}}$' --wait-for-maintenance
    vars:
      HOST:
        sh: yq --exit-status '.nodes[] | select(.ip == "{{.IP}}") | .host' {{.TALOS_DIR}}/topf.yaml
    requires:
      vars: [IP]
    preconditions:
      - talosctl --nodes {{.IP}} get machineconfig
      - which topf yq

  shutdown-cluster:
    desc: Shutdown Talos across the whole cluster
    prompt: Shutdown the Talos cluster ... continue?
    cmd: talosctl shutdown --nodes {{.NODES}} --force
    vars:
      NODES:
        sh: talosctl config info --output json | jq --exit-status --join-output '[.nodes[]] | join(",")'
    preconditions:
      - talosctl --nodes {{.NODES}} get machineconfig
      - which jq talosctl

  upgrade-k8s:
    desc: Upgrade Kubernetes to the version pinned in topf.yaml
    dir: '{{.TALOS_DIR}}'
    cmd: talosctl upgrade-k8s --to '{{.KUBERNETES_VERSION}}'
    vars:
      KUBERNETES_VERSION:
        sh: yq --exit-status '.kubernetesVersion' {{.TALOS_DIR}}/topf.yaml
    preconditions:
      - talosctl config info
      - test -f {{.TALOSCONFIG}}
      - which talosctl yq

  upgrade-node:
    desc: Upgrade Talos on a single node [IP=required]
    dir: '{{.TALOS_DIR}}'
    cmd: topf upgrade --nodes-filter '^{{.HOST}}$' --drain
    vars:
      HOST:
        sh: yq --exit-status '.nodes[] | select(.ip == "{{.IP}}") | .host' {{.TALOS_DIR}}/topf.yaml
    requires:
      vars: [IP]
    preconditions:
      - talosctl --nodes {{.IP}} get machineconfig
      - test -f {{.TALOSCONFIG}}
      - which topf talosctl yq
